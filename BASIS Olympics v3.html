p(c=>{const p=S.pokeById[c.pokemon_id];if(!p)return '';const st=buildStory(D,p.id);const q=st&&st.enc.find(r=>r.is_correct);\n    return `<div class=\"pk\"><img src=\"${esc(p.image_url)}\"><b>${esc(p.name)}<\u002Fb><small>${num3(p.pokedex_id)} · ${fmtDate(c.caught_date)}${c.is_shiny?' ✨':''}<\u002Fsmall><small>${q?`${esc(String(q.prompt).replace(/\\s*=\\s*\\?$/,''))} = ${esc(q.answer_given)} ✓ ${q.time_ms?(q.time_ms/1000).toFixed(1)+'s':''}`:'question not recorded'}<\u002Fsmall><\u002Fdiv>`;}).join('');\n  return `<section class=\"pg\">\n   <div class=\"hd\"><div><div class=\"kick\">BASIS Olympics · Family Report<\u002Fdiv><h1>${esc(s.name)}<\u002Fh1><div>${studentGrade(s)==='K'?'Kindergarten':'Grade '+studentGrade(s)} · Element ${esc(s.class_name||'—')} · Level ${lv.n} ${esc(lv.name)}<\u002Fdiv><\u002Fdiv>${card?`<img class=\"tc\" src=\"${card}\">`:''}<\u002Fdiv>\n   <p class=\"letter\">Dear ${esc(lastName(s))} Family,<br>${esc(PARENT_MSGS[hashIdx(s.id,12)](f))}<br><br>Thank you,<br>Mrs. Rose and Mr. Isaac Lane-James<\u002Fp>\n   <div class=\"grid4\"><div><b>${stats.xp}<\u002Fb>Total XP<\u002Fdiv><div><b>${stats.caught}<\u002Fb>Pokémon<\u002Fdiv><div><b>${b.medals.length}<\u002Fb>Medals<\u002Fdiv><div><b>${stats.completed}<\u002Fb>Events done<\u002Fdiv><\u002Fdiv>\n   <h2>XP over time<\u002Fh2>${sparkSVG(b)}\n   <h2>Event results<\u002Fh2>${evRows?`<table><tr><th>Event<\u002Fth><th>1<\u002Fth><th>2<\u002Fth><th>3<\u002Fth><th>4<\u002Fth><th>5<\u002Fth><th>Best<\u002Fth><\u002Ftr>${evRows}<\u002Ftable>`:'<p class=\"mu\">No event results yet.<\u002Fp>'}\n   ${b.medals.length?`<p>${b.medals.map(m=>`<span class=\"md\" style=\"background:${(METALS[m.place-1]||METALS[9])[2]}\">${ordinal(m.place)} ${esc(m.metal_name)} · ${esc((S.events.find(e=>e.id===m.event_id)||{}).name||m.sport_type||'Overall')}<\u002Fspan>`).join(' ')}<\u002Fp>`:''}\n   <h2>Math<\u002Fh2><div class=\"grid4\"><div><b>${resp.length}<\u002Fb>Questions<\u002Fdiv><div><b>${resp.length?Math.round(ok.length/resp.length*100):0}%<\u002Fb>Correct<\u002Fdiv><div><b>${tn?(tt/tn/1000).toFixed(1):'—'}s<\u002Fb>Average time<\u002Fdiv><div><b>${Math.round(tt/60000)} min<\u002Fb>Total time<\u002Fdiv><\u002Fdiv>\n   <table><tr><th>Skill<\u002Fth><th>Answers<\u002Fth><th>Accuracy<\u002Fth><\u002Ftr>${Object.entries(bySkill).map(([k,o])=>`<tr><td>${esc(k)}<\u002Ftd><td>${o.n}<\u002Ftd><td>${Math.round(o.c/o.n*100)}%<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftable>\n  <\u002Fsection>\n  <section class=\"pg\"><h2>Every question ${esc(f)} answered<\u002Fh2><table class=\"sm\"><tr><th>Date<\u002Fth><th>Question<\u002Fth><th>Answer<\u002Fth><th><\u002Fth><th>Time<\u002Fth><\u002Ftr>${resp.map(r=>`<tr><td>${fmtDate(r.created_at)}<\u002Ftd><td>${esc(r.prompt||'')}<\u002Ftd><td>${esc(r.answer_given)}<\u002Ftd><td style=\"color:${r.is_correct?'#16692d':'#b01'}\">${r.is_correct?'✓':'✗ ('+esc(r.correct_text||'')+')'}<\u002Ftd><td>${r.time_ms?(r.time_ms/1000).toFixed(1)+'s':''}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftable><\u002Fsection>\n  ${dex?`<section class=\"pg\"><h2>${esc(f)}'s Pokédex<\u002Fh2><div class=\"dexg\">${dex}<\u002Fdiv><\u002Fsection>`:''}`;\n}\nasync function openReports(ids){\n  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to open reports','⚠️');return;}\n  w.document.write('<p style=\"font-family:sans-serif;padding:40px\">Building report…<\u002Fp>');\n  const parts=[];for(const id of ids)parts.push(await reportHTML(id));\n  w.document.open();w.document.write(`<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>BASIS Olympics Reports<\u002Ftitle>\n  <link href=\"https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n  <style>body{font-family:Fredoka,sans-serif;color:#222;margin:0;background:#eee}.pg{background:#fff;max-width:8in;margin:20px auto;padding:.5in;box-sizing:border-box;page-break-after:always}\n  h1{font-family:Bungee;font-weight:400;color:#9e1218;margin:4px 0;font-size:30px}h2{font-family:Bungee;font-weight:400;color:#9e1218;font-size:17px;margin:20px 0 8px}\n  .kick{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#888}.hd{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.tc{width:2.1in;border-radius:10px}\n  .letter{background:#fff8e1;border-left:0;border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.5}\n  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.grid4 div{background:#f3efe4;border-radius:10px;padding:8px;text-align:center;font-size:12px}.grid4 b{display:block;font-family:Bungee;font-weight:400;font-size:20px;color:#1466b0}\n  table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e6dfcc;padding:4px 6px;text-align:left}th{background:#f3efe4}table.sm{font-size:11px}\n  .md{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;margin:2px;border:1px solid #888}.mu{color:#888}\n  .dexg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pk{border:1px solid #ddd;border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column;font-size:12px}.pk img{width:70px;height:70px;object-fit:contain;margin:0 auto}.pk small{color:#666;font-size:10px}\n  @media print{body{background:#fff}.pg{margin:0;max-width:none}}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}<\u002Fstyle><\u002Fhead>\n  <body>${parts.join('')}<script>window.onload=()=>setTimeout(()=>print(),800)<\\/script><\u002Fbody><\u002Fhtml>`);w.document.close();\n}\n\n/* ---------- Teacher Events: AI prompt, JSON import, bulk delete, score resets ---------- */\nfunction eventsAIPrompt(){\n  return `You are my helper for planning PE events for \"BASIS Olympics\", a K–3 school Olympics. Chat with me to brainstorm and refine event ideas, then give me the final list as JSON I can paste into my app.\n\nHOW TO WORK WITH ME\n1. Ask what kinds of events I want (sports, skills, grade levels, space/equipment I have). Suggest fun, kid-friendly ideas that are easy to score fairly.\n2. For each event, decide the settings yourself when it's obvious, and ASK me when it isn't:\n   - Races, sprints, timed runs, relays, \"how fast\" events → scoring_mode \"lowest_wins\" (less time is better), unit_label \"seconds\".\n   - Counting events (dribbles, catches, jumps, baskets, points, reps, distance) → scoring_mode \"highest_wins\".\n   - Ask me if I want a time limit (e.g. \"most dribbles in 1 minute\" → time_limit_minutes 1), or no limit (null).\n   - Ask how many tries each student gets (1–5; default 5).\n   - Ask about anything that could be scored unfairly, and write clear rules in the description so nobody can game it.\n3. Before giving JSON, show a short summary table and ask \"Ready for the JSON?\" Then output ONLY the JSON in one code block.\n\nEXACT JSON FORMAT (an array; one object per event; use these keys exactly):\n[\n  {\n    \"name\": \"40 m Dash\",                 // required, short and kid-friendly\n    \"sport_type\": \"Track\",               // one of: Basketball, Soccer, Disc, Accuracy, Track, Field, Fitness, Other\n    \"unit_label\": \"seconds\",             // what the number means, e.g. seconds, Dribbles, Catches, Points, Ups, meters\n    \"scoring_mode\": \"lowest_wins\",       // \"lowest_wins\" (less is better, e.g. time) or \"highest_wins\" (more is better)\n    \"max_attempts_per_student\": 5,       // integer 1–5\n    \"time_limit_minutes\": null,          // number of minutes for \"in X minutes\" events, otherwise null\n    \"description\": \"Start behind the cone line. Teacher times from 'Go' to crossing the finish cone.\"\n  }\n]\nRules for the JSON: valid JSON only (no comments, no trailing commas), double quotes, numbers not strings, null not \"none\".`;\n}\nlet EV_SEL=new Set();\nconst _tEvents=tEvents;tEvents=async function(b){\n  await _tEvents(b);\n  document.querySelectorAll('#evList .list-item').forEach((it,i)=>{const e=S.events[i];if(!e)return;it.insertAdjacentHTML('afterbegin',`<input type=\"checkbox\" data-pick=\"${e.id}\" ${EV_SEL.has(e.id)?'checked':''} style=\"width:24px;height:24px;min-height:auto\">`);});\n  b.insertAdjacentHTML('afterbegin',`<h3>Plan events with AI<\u002Fh3>\n   <div class=\"row\" style=\"margin-bottom:8px\"><button class=\"blue\" id=\"aiCopy\">📋 Copy AI instructions<\u002Fbutton><span class=\"muted\">Paste into ChatGPT / Claude, chat about your ideas, then paste the JSON it gives you below.<\u002Fspan><\u002Fdiv>\n   <textarea id=\"evJson\" placeholder='[{\"name\":\"40 m Dash\",\"sport_type\":\"Track\",\"unit_label\":\"seconds\",\"scoring_mode\":\"lowest_wins\",\"max_attempts_per_student\":5,\"time_limit_minutes\":null,\"description\":\"...\"}]'><\u002Ftextarea>\n   <div class=\"row\" style=\"margin:8px 0 24px\"><button class=\"green\" id=\"evImport\">⬆️ Import events<\u002Fbutton><label class=\"btn\" style=\"min-height:44px;padding:8px 16px\">📄 From .json file<input type=\"file\" accept=\".json,application/json,text/plain\" id=\"evJsonFile\" hidden><\u002Flabel><span id=\"evImpRes\" style=\"font-weight:600\"><\u002Fspan><\u002Fdiv>`);\n  const evH=[...b.querySelectorAll('h3')].find(h=>/^Events \\(/.test(h.textContent));\n  evH.insertAdjacentHTML('afterend',`<div class=\"row\" style=\"margin-bottom:10px\"><button class=\"small\" id=\"evSelAll\">Select all<\u002Fbutton><button class=\"small\" id=\"evSelNone\">Clear<\u002Fbutton><button class=\"small red\" id=\"evDelSel\">🗑️ Delete selected (<span id=\"evSelN\">${EV_SEL.size}<\u002Fspan>)<\u002Fbutton><button class=\"small yellow\" id=\"evResetSel\">↺ Reset scores of selected<\u002Fbutton><\u002Fdiv>`);\n  b.insertAdjacentHTML('beforeend',`<h3 style=\"margin-top:24px\">Reset scores<\u002Fh3>\n   <div class=\"row\"><label>Student <select id=\"rsStu\"><option value=\"\">— everyone —<\u002Foption>${S.students.map(s=>`<option value=\"${s.id}\">${esc(s.name)}${s.class_name?' ('+esc(s.class_name)+')':''}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <label>Event <select id=\"rsEv\"><option value=\"\">— all events —<\u002Foption>${S.events.map(e=>`<option value=\"${e.id}\">${esc(e.name)}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <button class=\"red\" id=\"rsGo\">↺ Reset these scores<\u002Fbutton><\u002Fdiv><p class=\"muted\">Removes the attempts so they can be re-entered; medals recalculate. XP already earned is kept.<\u002Fp>`);\n  const n=()=>$('#evSelN').textContent=EV_SEL.size;\n  $('#evList').addEventListener('change',e=>{const id=e.target.dataset.pick;if(!id)return;e.target.checked?EV_SEL.add(id):EV_SEL.delete(id);n();});\n  $('#evSelAll').onclick=()=>{S.events.forEach(e=>EV_SEL.add(e.id));document.querySelectorAll('[data-pick]').forEach(c=>c.checked=true);n();};\n  $('#evSelNone').onclick=()=>{EV_SEL.clear();document.querySelectorAll('[data-pick]').forEach(c=>c.checked=false);n();};\n  const ids=()=>[...EV_SEL].filter(id=>S.events.some(e=>e.id===id));\n  $('#evDelSel').onclick=async()=>{const l=ids();if(!l.length){toast('Tick some events first','⚠️');return;}\n    if(!await confirmBox(`Delete ${l.length} event${l.length>1?'s':''} and all their scores?`))return;\n    await del('oly_event_scores',`event_id=in.(${l.join(',')})`);await del('oly_events',`id=in.(${l.join(',')})`);EV_SEL.clear();await loadCore();await recalcMedals();toast(`Deleted ${l.length} events`,'🗑️');renderTeacher();};\n  $('#evResetSel').onclick=async()=>{const l=ids();if(!l.length){toast('Tick some events first','⚠️');return;}\n    if(!await confirmBox(`Reset ALL scores for ${l.length} event${l.length>1?'s':''}?`))return;\n    await del('oly_event_scores',`event_id=in.(${l.join(',')})`);await recalcMedals();toast('Scores reset','↺');renderTeacher();};\n  $('#rsGo').onclick=async()=>{const s=$('#rsStu').value,e=$('#rsEv').value;\n    const who=s?studentName(s):'EVERYONE',what=e?(S.events.find(x=>x.id===e)||{}).name:'all events';\n    if(!await confirmBox(`Reset scores for ${who} in ${what}?`))return;\n    const f=[s&&`student_id=eq.${s}`,e&&`event_id=eq.${e}`].filter(Boolean).join('&')||'id=not.is.null';\n    await del('oly_event_scores',f);await recalcMedals();toast('Scores reset','↺');renderTeacher();};\n  $('#aiCopy').onclick=async()=>{const t=eventsAIPrompt();try{await navigator.clipboard.writeText(t);toast('AI instructions copied!','📋');}\n    catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('AI instructions copied!','📋');}};\n  $('#evJsonFile').onchange=async e=>{const f=e.target.files[0];if(f)$('#evJson').value=await f.text();};\n  $('#evImport').onclick=async()=>{\n    let raw=$('#evJson').value.trim();const m=raw.match(/```(?:json)?\\s*([\\s\\S]*?)```/);if(m)raw=m[1].trim();\n    let arr;try{arr=JSON.parse(raw);}catch(err){$('#evImpRes').textContent='❌ Not valid JSON: '+err.message;return;}\n    if(!Array.isArray(arr))arr=arr&&Array.isArray(arr.events)?arr.events:[arr];\n    const have=new Set(S.events.map(e=>norm(e.name)));const rows=[],skipped=[];\n    arr.forEach(x=>{if(!x||!String(x.name||'').trim()){skipped.push('(no name)');return;}if(have.has(norm(x.name))){skipped.push(x.name);return;}\n      const mode=/low|less|fast|time/i.test(x.scoring_mode||'')?'lowest_wins':'highest_wins';\n      rows.push({name:String(x.name).trim(),sport_type:x.sport_type||null,unit_label:x.unit_label||null,scoring_mode:mode,\n        max_attempts_per_student:Math.min(5,Math.max(1,parseInt(x.max_attempts_per_student)||5)),time_limit_minutes:+x.time_limit_minutes||null,description:x.description||null});have.add(norm(x.name));});\n    if(!rows.length){$('#evImpRes').textContent='Nothing new to import'+(skipped.length?` (skipped: ${skipped.join(', ')})`:'');return;}\n    await ins('oly_events',rows);SFX.chime();toast(`Imported ${rows.length} events`,'✅');\n    $('#evImpRes').textContent=`✅ Imported ${rows.length}${skipped.length?` · skipped duplicates: ${skipped.join(', ')}`:''}`;setTimeout(renderTeacher,900);};\n};\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
