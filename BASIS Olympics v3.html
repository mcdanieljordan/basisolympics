const cost=b==='greatball'?set.greatball_cost:set.pokeball_cost;\n    if(wallet()<cost){toast('Not enough XP for that ball!','❌');o.close();return;}\n    o.remove();SFX.click();\n    await saveXP({xp_spent:(ST.xp.xp_spent||0)+cost});\n    beginEncounter(b);\n  };\n}\nconst ENC_SIZE=5;\nfunction timeLimit(){return studentGrade(ST.s)==='K'?40:20;}\nfunction cardsForTime(sec){const f=timeLimit()/20;return sec<=5*f?5:sec<=8*f?4:sec<=11*f?3:sec<=15*f?2:sec<=20*f?1:0;}\nasync function beginEncounter(ball){\n  const legPool=encounterPool(true);\n  const legendary=!!(ST.xp.legendary_pending&&legPool.length);\n  if(ST.xp.legendary_pending)await saveXP({legendary_pending:false});\n  const pool=legendary?legPool:encounterPool(false);\n  if(!pool.length){toast('No Pokémon left to find!','😮');renderPlayBody();return;}\n  const ps=legendary?[rand(pool)]:shuffle(pool).slice(0,ENC_SIZE),lvl=ST.xp.level||1;\n  ENC={ball,ps,p:ps[0],legendary,need:lvl<=3?2:lvl<=6?3:4,streak:0,retryUsed:false,used:new Set(),q:null,t0:0,timer:null,done:false,answered:false};\n  const lim=timeLimit();\n  const o=openOverlay(`<div class=\"modal enc-modal ${legendary?'legend':''}\" id=\"encModal\">\n    <div class=\"enc-top\"><div class=\"bungee\" style=\"font-size:1.4rem;color:var(--red-deep)\">${legendary?'🌟 A LEGENDARY Pokémon has appeared!':`${ps.length} wild Pokémon are hiding!`}<\u002Fdiv>\n    <div class=\"row\"><div class=\"pball ${ball==='greatball'?'great':''}\"><\u002Fdiv><div class=\"timer\" id=\"encTimer\">${lim}s<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"tbar\"><i id=\"encBar\"><\u002Fi><\u002Fdiv>\n    <div class=\"tbar-legend\">${[5,4,3,2,1].map(n=>`<span id=\"tb${n}\">${'🃏'.repeat(n)}<\u002Fspan>`).join('')}<\u002Fdiv>\n    <div class=\"wild\" id=\"encWild\">${legendary?`<img src=\"${esc(ps[0].image_url)}\" class=\"sil\" alt=\"\">`:ps.map(()=>'<div class=\"mini-back\"><\u002Fdiv>').join('')}<\u002Fdiv>\n    ${legendary?`<div id=\"legProg\"><\u002Fdiv>`:''}\n    <div id=\"encQ\"><\u002Fdiv><div id=\"encFb\"><\u002Fdiv><\u002Fdiv>`);\n  ENC.overlay=o;\n  if(legendary){screenFlash();SFX.legend();renderLegProg();}\n  nextEncQuestion(false);\n}\nfunction renderLegProg(){\n  const el=$('#legProg');if(!el)return;\n  el.innerHTML=`<div style=\"font-size:1.3rem;font-weight:600;text-align:center;margin-bottom:6px\">Answer ${ENC.need} correctly in a row! (${ENC.streak} of ${ENC.need})<\u002Fdiv><div class=\"bar\"><i style=\"width:${ENC.streak/ENC.need*100}%\"><\u002Fi><\u002Fdiv>`;\n}\nfunction startTimer(onTimeout){\n  clearInterval(ENC.timer);ENC.t0=performance.now();const lim=timeLimit();\n  ENC.timer=setInterval(()=>{\n    const el=(performance.now()-ENC.t0)/1000,left=Math.max(0,lim-el);\n    const t=$('#encTimer');if(t)t.textContent=left.toFixed(1)+'s';\n    const bar=$('#encBar');if(bar){bar.style.width=(left/lim*100)+'%';bar.style.background=left>lim*.5?'var(--green)':left>lim*.25?'var(--yellow)':'var(--red)';}\n    const n=cardsForTime(el);[5,4,3,2,1].forEach(k=>{const x=$('#tb'+k);if(x)x.classList.toggle('on',k===n);});\n    if(left<=0){clearInterval(ENC.timer);onTimeout();}\n  },100);\n}\nfunction nextEncQuestion(same){\n  if(!same){ENC.q=pickQuestion(ENC.used);if(ENC.q.id)ENC.used.add(ENC.q.id);}\n  const box=$('#encQ');box.innerHTML='';const d=document.createElement('div');box.appendChild(d);\n  ENC.answered=false;\n  const handle=async(given,ok,fb,timedOut)=>{\n    if(ENC.answered||ENC.done)return;ENC.answered=true;\n    const secs=(performance.now()-ENC.t0)/1000;clearInterval(ENC.timer);\n    await logResponse(ENC.q,timedOut?'(time ran out)':given,ok);await adaptMath(ENC.q);\n    if(ok){\n      const g=await awardXP(ENC.q.xp_value||10);await patchLastResponseXP(g);SFX.correct();\n      if(ENC.legendary){\n        ENC.streak++;renderLegProg();\n        if(ENC.streak>=ENC.need){fb(`✅ Correct! +${g} XP`,true);return encounterWin(1);}\n        fb(`✅ Correct! +${g} XP — keep going!`,true);setTimeout(()=>nextEncQuestion(false),1300);return;\n      }\n      const n=cardsForTime(secs);\n      fb(`✅ Correct in ${secs.toFixed(1)}s! +${g} XP — you earned ${n} card${n>1?'s':''}!`,true);return encounterWin(n);\n    }\n    SFX.buzz();\n    if(ENC.ball==='greatball'&&!ENC.retryUsed){\n      ENC.retryUsed=true;\n      fb(timedOut?'⏰ Time\\'s up! But your Great Ball gives you one more chance!':'❌ Wrong! But your Great Ball gives you one more chance!',false);\n      const c=d.querySelector('.check');if(c)c.disabled=true;\n      setTimeout(()=>nextEncQuestion(ENC.legendary),1800);return;\n    }\n    fb(timedOut?'⏰ Time\\'s up! The Pokémon got away…':'❌ Wrong answer! The Pokémon got away…',false);\n    const c=d.querySelector('.check');if(c)c.disabled=true;\n    encounterLose();\n  };\n  renderQuestion(d,ENC.q,(g,ok,fb)=>handle(g,ok,fb,false));\n  startTimer(()=>{const f=d.querySelector('.fb');handle('',false,(m,good)=>{f.className='fb '+(good?'good':'bad');f.textContent=m;},true);});\n}\nasync function logThrows(list,answered,caught){\n  if(!list.length)return;\n  const r=await ins('oly_throws',list.map(p=>({student_id:ST.s.id,pokemon_id:p.id,ball_type:ENC.ball,question_id:ENC.q&&ENC.q.id,answered_correctly:answered,caught})));\n  ST.throws.push(...(r||[]));\n}\nasync function encounterWin(n){\n  ENC.done=true;clearInterval(ENC.timer);\n  const won=ENC.ps.slice(0,Math.max(1,n));\n  const r=await ins('oly_student_pokemon',won.map(p=>({student_id:ST.s.id,pokemon_id:p.id,ball_type:ENC.ball})),{onConflict:'student_id,pokemon_id',ignore:true});\n  ST.caught.push(...(r||[]));\n  await logThrows(won,true,true);\n  won.forEach(p=>LOCAL_CATCH.add(ST.s.id+'|'+p.id));\n  await new Promise(r=>setTimeout(r,900));\n  ENC.overlay.remove();\n  const vid=await playVideo('catch_success',{keep:true});\n  await showCardReveal(won,true);\n  vid&&vid.close();\n  toast(`${ST.s.name} caught ${won.map(p=>p.name).join(', ')}!`,'🎉');\n  await loadDexCatches();\n  await checkAchievements();\n  DEX.selected=won[won.length-1].id;\n  ENC=null;showView('pokedex');\n}\nasync function encounterLose(){\n  ENC.done=true;clearInterval(ENC.timer);\n  await logThrows(ENC.ps,false,false);\n  await new Promise(r=>setTimeout(r,1500));\n  ENC.overlay.remove();\n  const vid=await playVideo('catch_fail',{keep:true});\n  await showCardReveal(ENC.ps,false);\n  vid&&vid.close();\n  await loadDexCatches();await checkAchievements();\n  ENC=null;renderPlayBody();\n}\nfunction showCardReveal(list,won){\n  return new Promise(res=>{\n    const o=openOverlay(`<div class=\"reveal-wrap\"><h2 class=\"bungee reveal-title\" style=\"color:${won?'#ffd23d':'#ff6b6b'}\">${won?`You caught ${list.length} Pokémon!`:'These Pokémon got away…'}<\u002Fh2>\n      <div class=\"reveal-row\">${list.map((p,i)=>{const img=won?(p.card_image_large||p.card_image_small||p.image_url):p.image_url;\n        return `<div class=\"flip ${won?'':'lost'}\" style=\"--d:${i*.45}s\" data-big=\"${esc(img)}\"><div class=\"flip-in\"><div class=\"flip-back\"><\u002Fdiv>\n          <div class=\"flip-front\">${won?`<img src=\"${esc(img)}\" alt=\"\">`:`<img src=\"${esc(img)}\" alt=\"\"><b>${esc(p.name)}<\u002Fb><span class=\"xmark\">✕<\u002Fspan>`}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;}).join('')}<\u002Fdiv>\n      <button class=\"${won?'green':'yellow'} reveal-btn\">${won?'See my Pokédex ▶':'Try again next time ▶'}<\u002Fbutton><\u002Fdiv>`,{cls:'reveal-ov'});\n    o.style.zIndex=270;\n    setTimeout(()=>{won?(SFX.chime(),confetti(160)):SFX.buzz();},list.length*450+500);\n    if(won)list.forEach((p,i)=>setTimeout(()=>playAudio(p.audio_url),900+i*450));\n    o.onclick=e=>{\n      const f=e.target.closest('.flip');if(f&&won){const z=openOverlay(`<img src=\"${esc(f.dataset.big)}\" class=\"reveal\" style=\"max-height:92vh;max-width:92vw;border-radius:18px\">`);z.style.zIndex=280;z.onclick=()=>z.remove();return;}\n      if(e.target.closest('.reveal-btn')){o.remove();res();}\n    };\n  });\n}\nfunction playVideo(type,{keep}={}){\n  const vids=S.media.filter(m=>m.media_type===type&&m.video_url);if(!vids.length)return Promise.resolve(null);\n  const url=rand(vids).video_url;\n  return new Promise(res=>{\n    const yt=url.match(/(?:youtube\\.com\\/watch\\?v=|youtu\\.be\\/)([\\w-]+)/);\n    const o=openOverlay(`<div class=\"modal\" style=\"max-width:960px;padding:12px;text-align:center\">\n      ${yt?`<iframe width=\"100%\" height=\"520\" src=\"https://www.youtube.com/embed/${yt[1]}?autoplay=1\" allow=\"autoplay\" frameborder=\"0\"><\u002Fiframe>`:`<video src=\"${esc(url)}\" autoplay playsinline style=\"width:100%;max-height:75vh;border-radius:16px\"><\u002Fvideo>`}\n      <button class=\"red\" style=\"margin-top:10px\" data-x>Close<\u002Fbutton><\u002Fdiv>`);\n    o.style.zIndex=260;\n    const handle={close:()=>o.remove()};\n    const done=()=>{if(keep){o.querySelector('[data-x]').remove();res(handle);}else{o.remove();res();}};\n    o.querySelector('[data-x]').onclick=()=>{o.remove();res(null);};\n    const vid=o.querySelector('video');if(vid){vid.onended=done;vid.onerror=()=>{o.remove();res(null);};}\n  });\n}\n\n/* ============================================================\n   STUDENT EVENTS VIEW\n   ============================================================ */\nlet EV_SPORT=null;\nasync function renderStudentEvents(){\n  const v=$('#view-events');\n  v.innerHTML=`<div class=\"panel row\">${studentPicker('evPick')}<\u002Fdiv><div id=\"evBody\"><\u002Fdiv>`;\n  bindPicker('evPick',()=>{EV_SPORT=null;renderStudentEvents();});\n  if(!S.currentStudent||!S.students.find(s=>s.id===S.currentStudent)){$('#evBody').innerHTML='<div class=\"panel empty\">👆 Tap to find your name!<\u002Fdiv>';return;}\n  await loadStudent(S.currentStudent);\n  const st=ST,stats=studentStats(),lv=levelInfo(stats.level);\n  const sports=[...new Set(S.events.map(e=>e.sport_type||'Other'))];\n  const evs=EV_SPORT?S.events.filter(e=>(e.sport_type||'Other')===EV_SPORT):[];\n  const tries=ev=>st.scores.filter(x=>x.event_id===ev.id).length;\n  $('#evBody').innerHTML=`\n  <div class=\"panel mini-dash\">\n    <div class=\"md-photo\">${st.s.photo_url?`<img src=\"${esc(st.s.photo_url)}\" alt=\"\">`:`<div class=\"pball\" style=\"width:90px;height:90px\"><\u002Fdiv>`}<\u002Fdiv>\n    <div class=\"grow\"><div class=\"tc-name\">${esc(st.s.name)}<\u002Fdiv>\n      <div class=\"row\" style=\"margin-top:6px\"><span class=\"tag el\">${esc(st.s.class_name||'')}<\u002Fspan><span class=\"tag\">${studentGrade(st.s)==='K'?'Kinder':'Grade '+studentGrade(st.s)}<\u002Fspan><span class=\"tag\">Lv ${lv.n} ${esc(lv.name)}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"md-stats\"><div><b>${stats.xp}<\u002Fb>XP<\u002Fdiv><div><b>${stats.caught}<\u002Fb>Pokémon<\u002Fdiv><div><b>${stats.completed}<\u002Fb>Events done<\u002Fdiv><div><b>${st.medals.length}<\u002Fb>Medals<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"panel\"><h2>➕ Add Results<\u002Fh2>\n    ${!S.events.length?'<div class=\"empty\">No events yet!<\u002Fdiv>':!EV_SPORT?`<p style=\"font-size:1.2rem;margin:0 0 10px\">Tap a sport:<\u002Fp><div class=\"tile-grid\">${sports.map(sp=>`<button class=\"sport-tile\" data-sport=\"${esc(sp)}\"><span>${sportIcon(sp)}<\u002Fspan>${esc(sp)}<small>${S.events.filter(e=>(e.sport_type||'Other')===sp).length} events<\u002Fsmall><\u002Fbutton>`).join('')}<\u002Fdiv>`\n    :`<div class=\"row\" style=\"margin-bottom:10px\"><button data-sport=\"\">◀ All sports<\u002Fbutton><span class=\"bungee\" style=\"font-size:1.4rem\">${sportIcon(EV_SPORT)} ${esc(EV_SPORT)}<\u002Fspan><\u002Fdiv>\n      <div class=\"tile-grid\">${evs.map(ev=>{const n=tries(ev),max=ev.max_attempts_per_student||5;return `<button class=\"sport-tile ev\" data-ev=\"${ev.id}\" ${n>=max?'disabled':''}><span>${sportIcon(ev.sport_type)}<\u002Fspan>${esc(ev.name)}<small>${n>=max?'✅ All done!':`Try ${n+1} of ${max}`}<\u002Fsmall><\u002Fbutton>`;}).join('')}<\u002Fdiv>`}\n  <\u002Fdiv>\n  <div id=\"evCards\"><\u002Fdiv>`;\n  $('#evBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;\n    if(b.dataset.sport!=null){EV_SPORT=b.dataset.sport||null;renderStudentEvents();}\n    if(b.dataset.ev)studentEnterResult(S.events.find(x=>x.id===b.dataset.ev));};\n  $('#evCards').innerHTML=S.events.filter(ev=>st.scores.some(x=>x.event_id===ev.id)).map(ev=>{\n    const mine=st.scores.filter(s=>s.event_id===ev.id).sort((a,b)=>a.attempt_number-b.attempt_number);\n    const max=ev.max_attempts_per_student||5,lo=ev.scoring_mode==='lowest_wins';\n    const vals=mine.map(s=>+s.score),best=bestOf(vals,ev.scoring_mode);\n    const meds=st.medals.filter(m=>m.event_id===ev.id);\n    let slots='';\n    for(let i=1;i<=max;i++){const s=mine.find(x=>x.attempt_number===i);\n      if(!s){slots+=`<div class=\"att none\"><small>Try ${i}<\u002Fsmall><b>—<\u002Fb><\u002Fdiv>`;continue;}\n      const prev=mine.filter(x=>x.attempt_number<i).map(x=>+x.score);const pv=prev.length?prev[prev.length-1]:null;\n      let arrow='';if(pv!=null){const better=lo?+s.score<pv:+s.score>pv,worse=lo?+s.score>pv:+s.score<pv;arrow=better?'<span class=\"up\">↑<\u002Fspan>':worse?'<span class=\"down\">↓<\u002Fspan>':'';}\n      slots+=`<div class=\"att ${+s.score===best?'best':''}\"><small>Try ${i}<\u002Fsmall><b>${+Number(s.score).toFixed(2)} ${arrow}<\u002Fb><small>${esc(ev.unit_label||'')}<\u002Fsmall><\u002Fdiv>`;}\n    return `<div class=\"ev-card\"><div class=\"row\" style=\"justify-content:space-between\"><h3>${sportIcon(ev.sport_type)} ${esc(ev.name)}<\u002Fh3><span class=\"tag\">${lo?'⏱️ Fastest time wins':'⬆️ Best score wins'}<\u002Fspan><\u002Fdiv>\n      <div class=\"attempts\">${slots}<\u002Fdiv><div style=\"font-size:1.3rem\"><b>⭐ My best:<\u002Fb> ${fmtScore(best,ev.unit_label)}<\u002Fdiv>\n      ${meds.length?`<div class=\"medals\" style=\"margin-top:10px\">${meds.map(medalHTML).join('')}<\u002Fdiv>`:''}<\u002Fdiv>`;}).join('');\n}\nfunction studentEnterResult(ev){\n  const used=ST.scores.filter(x=>x.event_id===ev.id).map(x=>x.attempt_number);\n  const max=ev.max_attempts_per_student||5;let att=1;while(used.includes(att))att++;\n  if(att>max){toast('All tries done for this event!','✅');return;}\n  openNumpad(ST.s,ev,att,'',async()=>{await afterScore(ST.s,true);renderStudentEvents();toast(`Saved! Try ${att} for ${ev.name}`,'🎉');SFX.chime();});\n}\nfunction sportIcon(s){return {Basketball:'🏀',Soccer:'⚽',Disc:'🥏',Accuracy:'🎯',Track:'🏃',Field:'🏟️',Fitness:'💪'}[s]||'🏅';}\n\n/* ============================================================\n   LEADERBOARD\n   ============================================================ */\nlet LB_EL='All';\nasync function renderLeaderboard(){\n  const v=$('#view-leader');\n  const [xps,caught,medals]=await Promise.all([sel('oly_student_xp','select=student_id,total_xp,level'),selAll('oly_student_pokemon','select=student_id'),sel('oly_medals','select=student_id')]);\n  const cc={},mc={};caught.forEach(c=>cc[c.student_id]=(cc[c.student_id]||0)+1);medals.forEach(m=>mc[m.student_id]=(mc[m.student_id]||0)+1);\n  const xpBy={};xps.forEach(x=>xpBy[x.student_id]=x);\n  let rows=S.students.map(s=>({s,xp:(xpBy[s.id]||{}).total_xp||0,level:(xpBy[s.id]||{}).level||1,caught:cc[s.id]||0,medals:mc[s.id]||0}));\n  if(LB_EL!=='All')rows=rows.filter(r=>r.s.class_name===LB_EL);\n  const ranked=rankWithTies(rows,'xp');\n  const cheer=r=>r.level>=9?'👑 Master!':r.medals?`🏅 ${r.medals} medal${r.medals>1?'s':''}!`:r.caught>=10?'🎒 Great collector!':r.caught?'⚪ Catching Pokémon!':r.xp?'🌱 Growing every day!':'🥚 Ready to start!';\n  v.innerHTML=`<div class=\"panel\"><h2>🏆 Leaderboard<\u002Fh2>\n    <div class=\"tabs\" id=\"lbTabs\">${['All',...sortedElements().map(e=>e.name)].map(e=>`<button data-e=\"${esc(e)}\" class=\"${e===LB_EL?'active':''}\">${esc(e)}<\u002Fbutton>`).join('')}<\u002Fdiv>\n    <div class=\"lb-row head\"><span>#<\u002Fspan><span>Trainer<\u002Fspan><span>Level<\u002Fspan><span>XP<\u002Fspan><span class=\"hide-m\">Pokémon<\u002Fspan><span class=\"hide-m\">Medals<\u002Fspan><\u002Fdiv>\n    ${ranked.length?ranked.map(r=>`<div class=\"lb-row\" style=\"${r.s.id===S.currentStudent?'border-color:var(--yellow);box-shadow:0 0 0 4px var(--yellow)':''}\">\n      <span class=\"lb-rank\">${r.place}<\u002Fspan><span><div class=\"lb-name\">${esc(r.s.name)}<\u002Fdiv><div class=\"cheer\">${cheer(r)}<\u002Fdiv><\u002Fspan>\n      <span><span class=\"lvl-badge\">${r.level}<\u002Fspan>${esc(levelInfo(r.level).name)}<\u002Fspan><span class=\"bungee\">${r.xp}<\u002Fspan>\n      <span class=\"hide-m\">⚪ ${r.caught}<\u002Fspan><span class=\"hide-m\">🏅 ${r.medals}<\u002Fspan><\u002Fdiv>`).join(''):'<div class=\"empty\">No trainers here yet!<\u002Fdiv>'}<\u002Fdiv>`;\n  $('#lbTabs').onclick=e=>{const b=e.target.closest('button');if(b){LB_EL=b.dataset.e;renderLeaderboard();}};\n}\n\n/* ============================================================\n   MEDALS\n   ============================================================ */\nasync function recalcMedals(){\n  const [scores,xps]=await Promise.all([selAll('oly_event_scores','select=student_id,event_id,score'),sel('oly_student_xp','select=student_id,total_xp')]);\n  const medals=[];const metal=p=>`${METALS[p-1][0]} (${METALS[p-1][1]})`;\n  const bestBy={}; // event -> student -> best\n  scores.forEach(s=>{const ev=S.events.find(e=>e.id===s.event_id);if(!ev)return;const m=(bestBy[s.event_id]=bestBy[s.event_id]||{});\n    const cur=m[s.student_id],v=+s.score;m[s.student_id]=cur==null?v:(ev.scoring_mode==='lowest_wins'?Math.min(cur,v):Math.max(cur,v));});\n  const normBy={}; // event -> student -> normalized 0..1 (1 best)\n  for(const [eid,m] of Object.entries(bestBy)){\n    const ev=S.events.find(e=>e.id===eid),lo=ev.scoring_mode==='lowest_wins';\n    const list=Object.entries(m).map(([sid,v])=>({sid,v}));\n    rankWithTies(list,'v',!lo).filter(r=>r.place<=10).forEach(r=>medals.push({student_id:r.sid,event_id:eid,sport_type:null,place:r.place,metal_name:metal(r.place)}));\n    const vals=list.map(x=>x.v),mx=Math.max(...vals),mn=Math.min(...vals);\n    normBy[eid]={};list.forEach(x=>normBy[eid][x.sid]=lo?(x.v>0?mn/x.v:1):(mx>0?x.v/mx:0));\n  }\n  const sports=[...new Set(S.events.map(e=>e.sport_type).filter(Boolean))];\n  sports.forEach(sp=>{\n    const evs=S.events.filter(e=>e.sport_type===sp&&normBy[e.id]);const agg={};\n    evs.forEach(e=>Object.entries(normBy[e.id]).forEach(([sid,v])=>{(agg[sid]=agg[sid]||[]).push(v);}));\n    const list=Object.entries(agg).map(([sid,a])=>({sid,v:Math.round(a.reduce((x,y)=>x+y,0)/a.length*10000)}));\n    rankWithTies(list,'v').filter(r=>r.place<=10).forEach(r=>medals.push({student_id:r.sid,event_id:null,sport_type:sp,place:r.place,metal_name:metal(r.place)}));\n  });\n  rankWithTies(xps.filter(x=>x.total_xp>0).map(x=>({sid:x.student_id,v:x.total_xp})),'v').filter(r=>r.place<=10)\n    .forEach(r=>medals.push({student_id:r.sid,event_id:null,sport_type:null,place:r.place,metal_name:metal(r.place)}));\n  await del('oly_medals','id=not.is.null');\n  if(medals.length)await ins('oly_medals',medals);\n}\n\n/* ============================================================\n   TEACHER\n   ============================================================ */\nlet T_TAB='Students';\nconst T_TABS=['Students','Questions','Assign','Events','Scores','Analytics','Goals','Settings'];\nasync function renderTeacher(){\n  const v=$('#view-teacher');\n  v.innerHTML=`<div class=\"panel\"><div class=\"tabs\" id=\"tTabs\">${T_TABS.map(t=>`<button data-t=\"${t}\" class=\"${t===T_TAB?'active':''}\">${t}<\u002Fbutton>`).join('')}<\u002Fdiv><div id=\"tBody\"><\u002Fdiv><\u002Fdiv>`;\n  $('#tTabs').onclick=e=>{const b=e.target.closest('button');if(b){T_TAB=b.dataset.t;renderTeacher();}};\n  await loadCore();\n  const f={Students:tStudents,Questions:tQuestions,Assign:tAssign,Events:tEvents,Scores:tScores,Analytics:tAnalytics,Goals:tGoals,Settings:tSettings}[T_TAB];\n  await f($('#tBody'));\n}\nfunction elementOptions(selected,withNone=true){return (withNone?'<option value=\"\">— none —<\u002Foption>':'')+sortedElements().map(e=>`<option ${e.name===selected?'selected':''}>${esc(e.name)}<\u002Foption>`).join('');}\n\n/* ---- Elements manager (shared by Students & Settings) ---- */\nfunction elementsManagerHTML(){\n  return `<h3>Elements (classes)<\u002Fh3><div id=\"elList\">${sortedElements().map((e,i,a)=>`<div class=\"list-item\"><b class=\"grow\">${esc(e.name)}<\u002Fb>\n    <button class=\"small\" data-up=\"${e.id}\" ${i===0?'disabled':''}>▲<\u002Fbutton><button class=\"small\" data-down=\"${e.id}\" ${i===a.length-1?'disabled':''}>▼<\u002Fbutton>\n    <button class=\"small red\" data-rm=\"${e.id}\">Remove<\u002Fbutton><\u002Fdiv>`).join('')}<\u002Fdiv>\n    <div class=\"row\"><input id=\"elNew\" placeholder=\"New Element, e.g. Kb\"><button class=\"blue\" id=\"elAdd\">Add Element<\u002Fbutton><\u002Fdiv>`;\n}\nfunction bindElementsManager(rerender){\n  $('#elAdd').onclick=async()=>{const n=$('#elNew').value.trim();if(!n)return;await ins('oly_elements',[{name:n,sort_order:S.elements.length+1}],{onConflict:'name',ignore:true});rerender();};\n  $('#elList').onclick=async e=>{\n    const d=e.target.dataset;const els=sortedElements();\n    if(d.rm){const el=els.find(x=>x.id===d.rm);if(!await confirmBox(`Remove Element \"${el.name}\"? Students keep their data but lose this Element tag on filters.`))return;\n      await del('oly_elements',`id=eq.${d.rm}`);await del('oly_settings',`element_name=eq.${encodeURIComponent(el.name)}`);rerender();}\n    const id=d.up||d.down;if(id){const i=els.findIndex(x=>x.id===id),j=d.up?i-1:i+1;[els[i],els[j]]=[els[j],els[i]];\n      await Promise.all(els.map((x,k)=>upd('oly_elements',`id=eq.${x.id}`,{sort_order:k+1})));rerender();}\n  };\n}\n\n/* ---- Students ---- */\nasync function tStudents(b){\n  const xpl={};(await sel('oly_student_xp','select=student_id,math_level')).forEach(x=>xpl[x.student_id]=x.math_level);\n  const lvlSel=s=>`<select data-ml=\"${s.id}\" title=\"Math level\"><option value=\"\">Math: auto (${START_LEVEL[studentGrade(s)]||6})<\u002Foption>${MATH_LEVELS.slice(1).map((L,i)=>`<option value=\"${i+1}\" ${xpl[s.id]===i+1?'selected':''}>Math ${i+1}: ${esc(L.name)}<\u002Foption>`).join('')}<\u002Fselect>`;\n  b.innerHTML=`<div class=\"row\" style=\"align-items:flex-start;gap:24px\">\n   <div class=\"grow\" style=\"min-width:300px\"><h3>Add students<\u002Fh3><textarea id=\"stNames\" placeholder=\"One name per line\"><\u002Ftextarea>\n    <div class=\"row\" style=\"margin-top:8px\"><label>Element <select id=\"stEl\">${elementOptions('')}<\u002Fselect><\u002Flabel><button class=\"green\" id=\"stAdd\">Add Students<\u002Fbutton><\u002Fdiv>\n    <div style=\"margin-top:20px\">${elementsManagerHTML()}<\u002Fdiv><\u002Fdiv>\n   <div class=\"grow\" style=\"min-width:320px\"><h3>All students (${S.students.length})<\u002Fh3><div id=\"stList\">${S.students.map(s=>`<div class=\"list-item\"><b class=\"grow\">${esc(s.name)}<\u002Fb>\n     <select data-el=\"${s.id}\">${elementOptions(s.class_name)}<\u002Fselect>${lvlSel(s)}${s.class_name&&!S.elements.find(e=>e.name===s.class_name)?`<span class=\"tag\">${esc(s.class_name)}<\u002Fspan>`:''}\n     <button class=\"small red\" data-rm=\"${s.id}\">Remove<\u002Fbutton><\u002Fdiv>`).join('')||'<p class=\"muted\">No students yet.<\u002Fp>'}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  $('#stAdd').onclick=async()=>{const names=$('#stNames').value.split('\\n').map(x=>x.trim()).filter(Boolean);if(!names.length)return;\n    const rows=await ins('oly_students',names.map(n=>({name:n,class_name:$('#stEl').value||null})));\n    await ins('oly_student_xp',rows.map(r=>({student_id:r.id})),{onConflict:'student_id',ignore:true});toast(`Added ${rows.length} students`,'✅');renderTeacher();};\n  $('#stList').onclick=async e=>{const id=e.target.dataset.rm;if(!id)return;const s=S.students.find(x=>x.id===id);\n    if(!await confirmBox(`Remove ${s.name}? This deletes ALL their catches, XP, answers and scores.`))return;await del('oly_students',`id=eq.${id}`);renderTeacher();};\n  $('#stList').onchange=async e=>{const ml=e.target.dataset.ml;if(ml){await ensureXP(ml);await upd('oly_student_xp',`student_id=eq.${ml}`,{math_level:+e.target.value||null});toast('Math level saved','✅');return;}\n    const id=e.target.dataset.el;if(id){await upd('oly_students',`id=eq.${id}`,{class_name:e.target.value||null});toast('Saved','✅');}};\n  bindElementsManager(renderTeacher);\n}\n\n/* ---- Questions ---- */\nlet Q_EDIT=null;\nasync function tQuestions(b){\n  const q=Q_EDIT?S.questions.find(x=>x.id===Q_EDIT):null;const ch=q?choicesOf(q):[];\n  b.innerHTML=`<h3>${q?'Edit question':'Add a question'}<\u002Fh3>\n  <datalist id=\"subjList\">${SUBJECTS.map(s=>`<option value=\"${s}\">`).join('')}<\u002Fdatalist>\n  <div class=\"form-grid\">\n   <label>Subject<input id=\"qSub\" list=\"subjList\" value=\"${esc(q?q.subject:'Math')}\"><\u002Flabel>\n   <label>Type<select id=\"qType\"><option value=\"multiple_choice\">Multiple Choice<\u002Foption><option value=\"short_answer\" ${q&&q.question_type==='short_answer'?'selected':''}>Short Answer<\u002Foption><\u002Fselect><\u002Flabel>\n   <label>Tier<select id=\"qTier\">${[1,2,3].map(t=>`<option ${q&&q.difficulty_level===t?'selected':''}>${t}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <label>TEKS code<input id=\"qTeks\" value=\"${esc(q?q.teks_standard:'')}\" placeholder=\"e.g. 3.4A\"><\u002Flabel>\n   <label>Skill tag<input id=\"qSkill\" value=\"${esc(q?q.skill_tag:'')}\" placeholder=\"e.g. fractions\"><\u002Flabel>\n   <label>XP value<input id=\"qXP\" type=\"number\" value=\"${q?q.xp_value:10}\"><\u002Flabel>\n  <\u002Fdiv>\n  <label>Question text<textarea id=\"qText\">${esc(q?q.content:'')}<\u002Ftextarea><\u002Flabel>\n  <div class=\"form-grid\" id=\"qChoices\">${'ABCD'.split('').map((L,i)=>`<label>Choice ${L}<input data-c=\"${i}\" value=\"${esc(ch[i]||'')}\"><\u002Flabel>`).join('')}<\u002Fdiv>\n  <div class=\"form-grid\"><label>Correct answer (text, or A–D for multiple choice)<input id=\"qAns\" value=\"${esc(q?q.correct_answer:'')}\"><\u002Flabel><\u002Fdiv>\n  <div class=\"row\"><button class=\"green\" id=\"qSave\">${q?'Save changes':'Add question'}<\u002Fbutton>${q?'<button id=\"qCancel\">Cancel edit<\u002Fbutton>':''}<\u002Fdiv>\n  <h3 style=\"margin-top:24px\">Question bank (${S.questions.length})<\u002Fh3>\n  <div id=\"qList\">${S.questions.map(x=>`<div class=\"list-item\"><div class=\"grow\"><b>${esc(x.content)}<\u002Fb><div>\n    <span class=\"tag\">${esc(x.subject||'')}<\u002Fspan><span class=\"tag\">Tier ${x.difficulty_level||1}<\u002Fspan>${x.teks_standard?`<span class=\"tag\">TEKS ${esc(x.teks_standard)}<\u002Fspan>`:''}${x.skill_tag?`<span class=\"tag\">${esc(x.skill_tag)}<\u002Fspan>`:''}<span class=\"tag\">${x.xp_value} XP<\u002Fspan>\n    <span class=\"muted\"> Answer: ${esc(x.correct_answer)}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <button class=\"small blue\" data-ed=\"${x.id}\">Edit<\u002Fbutton><button class=\"small red\" data-rm=\"${x.id}\">Delete<\u002Fbutton><\u002Fdiv>`).join('')||'<p class=\"muted\">No questions yet.<\u002Fp>'}<\u002Fdiv>`;\n  const toggle=()=>$('#qChoices').classList.toggle('hidden',$('#qType').value!=='multiple_choice');toggle();$('#qType').onchange=toggle;\n  if(q)$('#qCancel').onclick=()=>{Q_EDIT=null;renderTeacher();};\n  $('#qSave').onclick=async()=>{\n    const type=$('#qType').value,choices=type==='multiple_choice'?[...document.querySelectorAll('#qChoices input')].map(i=>i.value.trim()).filter(Boolean):[];\n    let ans=$('#qAns').value.trim();const content=$('#qText').value.trim();\n    if(!content||!ans){toast('Question text and correct answer are required','⚠️');return;}\n    if(type==='multiple_choice'&&/^[a-dA-D]$/.test(ans)&&choices['abcd'.indexOf(ans.toLowerCase())])ans=choices['abcd'.indexOf(ans.toLowerCase())];\n    if(type==='multiple_choice'&&choices.length<2){toast('Add at least 2 choices','⚠️');return;}\n    if(type==='multiple_choice'&&!choices.some(c=>norm(c)===norm(ans))){toast('Correct answer must match one of the choices','⚠️');return;}\n    const row={subject:$('#qSub').value,question_type:type,difficulty_level:+$('#qTier').value,teks_standard:$('#qTeks').value||null,skill_tag:$('#qSkill').value||null,xp_value:+$('#qXP').value||10,content,choices,correct_answer:ans};\n    if(Q_EDIT)await upd('oly_questions',`id=eq.${Q_EDIT}`,row);else await ins('oly_questions',[row]);\n    Q_EDIT=null;toast('Question saved','✅');renderTeacher();\n  };\n  $('#qList').onclick=async e=>{const d=e.target.dataset;\n    if(d.ed){Q_EDIT=d.ed;renderTeacher();scrollTo(0,0);}\n    if(d.rm&&await confirmBox('Delete this question? Assignments and answers for it will be removed too.')){await del('oly_questions',`id=eq.${d.rm}`);renderTeacher();}};\n}\n\n/* ---- Assign ---- */\nasync function tAssign(b){\n  b.innerHTML=`<div class=\"row\" style=\"align-items:flex-start;gap:24px\">\n   <div class=\"grow\" style=\"min-width:320px\"><h3>1. Pick questions<\u002Fh3><div class=\"row\" style=\"margin-bottom:6px\"><button class=\"small\" id=\"aAllQ\">Select all<\u002Fbutton><button class=\"small\" id=\"aNoneQ\">Clear<\u002Fbutton><\u002Fdiv>\n    <div class=\"checklist\" id=\"aQs\">${S.questions.map(q=>`<label><input type=\"checkbox\" value=\"${q.id}\"><span>${esc(q.content)} <span class=\"tag\">${esc(q.subject||'')}<\u002Fspan><span class=\"tag\">T${q.difficulty_level}<\u002Fspan>${q.skill_tag?`<span class=\"tag\">${esc(q.skill_tag)}<\u002Fspan>`:''}<\u002Fspan><\u002Flabel>`).join('')||'<p class=\"muted\">Add questions first.<\u002Fp>'}<\u002Fdiv><\u002Fdiv>\n   <div class=\"grow\" style=\"min-width:320px\"><h3>2. Who gets them?<\u002Fh3>\n    <label style=\"display:block;margin:6px 0\"><input type=\"radio\" name=\"aWho\" value=\"all\" checked style=\"min-height:auto\"> Everyone<\u002Flabel>\n    <label style=\"display:block;margin:6px 0\"><input type=\"radio\" name=\"aWho\" value=\"pick\" style=\"min-height:auto\"> Choose students<\u002Flabel>\n    <div id=\"aStuWrap\" class=\"hidden\"><div class=\"row\" style=\"margin:6px 0\">${sortedElements().map(e=>`<button class=\"small\" data-sel-el=\"${esc(e.name)}\">All ${esc(e.name)}<\u002Fbutton>`).join('')}<\u002Fdiv>\n     <div class=\"checklist\" id=\"aStu\">${S.students.map(s=>`<label><input type=\"checkbox\" value=\"${s.id}\" data-el=\"${esc(s.class_name||'')}\"><span>${esc(s.name)} <span class=\"tag el\">${esc(s.class_name||'')}<\u002Fspan><\u002Fspan><\u002Flabel>`).join('')}<\u002Fdiv><\u002Fdiv>\n    <button class=\"green\" id=\"aGo\" style=\"margin-top:14px\">Assign<\u002Fbutton><div id=\"aRes\" style=\"margin-top:10px;font-weight:600\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  $('#aAllQ').onclick=()=>document.querySelectorAll('#aQs input').forEach(i=>i.checked=true);\n  $('#aNoneQ').onclick=()=>document.querySelectorAll('#aQs input').forEach(i=>i.checked=false);\n  document.querySelectorAll('[name=aWho]').forEach(r=>r.onchange=()=>$('#aStuWrap').classList.toggle('hidden',r.value!=='pick'||!r.checked));\n  $('#aStuWrap').onclick=e=>{const el=e.target.dataset.selEl;if(el!=null)document.querySelectorAll(`#aStu input[data-el=\"${CSS.escape(el)}\"]`).forEach(i=>i.checked=true);};\n  $('#aGo').onclick=async()=>{\n    const qs=[...document.querySelectorAll('#aQs input:checked')].map(i=>i.value);\n    const who=document.querySelector('[name=aWho]:checked').value;\n    const ss=who==='all'?S.students.map(s=>s.id):[...document.querySelectorAll('#aStu input:checked')].map(i=>i.value);\n    if(!qs.length||!ss.length){$('#aRes').textContent='Pick at least one question and one student.';return;}\n    const existing=await selAll('oly_assignments','select=student_id,question_id');const have=new Set(existing.map(a=>a.student_id+'|'+a.question_id));\n    const rows=[];ss.forEach(s=>qs.forEach(q=>{if(!have.has(s+'|'+q))rows.push({student_id:s,question_id:q});}));\n    if(rows.length)await ins('oly_assignments',rows,{onConflict:'student_id,question_id',ignore:true});\n    $('#aRes').textContent=`✅ Assigned ${rows.length} new · ${ss.length*qs.length-rows.length} were already assigned.`;\n  };\n}\n\n/* ---- Events (teacher) ---- */\nlet EV_EDIT=null;\nasync function tEvents(b){\n  const ev=EV_EDIT?S.events.find(e=>e.id===EV_EDIT):null;\n  b.innerHTML=`<h3>${ev?'Edit event':'Create an event'}<\u002Fh3>\n  <datalist id=\"sportList\">${SPORTS.map(s=>`<option value=\"${s}\">`).join('')}<\u002Fdatalist><datalist id=\"unitList\">${UNITS.map(s=>`<option value=\"${s}\">`).join('')}<\u002Fdatalist>\n  <div class=\"form-grid\">\n   <label>Event name<input id=\"evName\" value=\"${esc(ev?ev.name:'')}\"><\u002Flabel>\n   <label>Sport type<input id=\"evSport\" list=\"sportList\" value=\"${esc(ev?ev.sport_type:'')}\"><\u002Flabel>\n   <label>Unit label<input id=\"evUnit\" list=\"unitList\" value=\"${esc(ev?ev.unit_label:'')}\"><\u002Flabel>\n   <label>Scoring mode<select id=\"evMode\"><option value=\"highest_wins\">Best Score Wins<\u002Foption><option value=\"lowest_wins\" ${ev&&ev.scoring_mode==='lowest_wins'?'selected':''}>Fastest Time Wins<\u002Foption><\u002Fselect><\u002Flabel>\n   <label>Max attempts<input id=\"evMax\" type=\"number\" min=\"1\" max=\"5\" value=\"${ev?ev.max_attempts_per_student:5}\"><\u002Flabel>\n   <label>Time limit (minutes, optional)<input id=\"evTime\" type=\"number\" value=\"${ev&&ev.time_limit_minutes||''}\"><\u002Flabel>\n  <\u002Fdiv>\n  <label>Description / rules<textarea id=\"evDesc\" placeholder=\"Explain exactly how it's scored so nobody can game it\">${esc(ev?ev.description:'')}<\u002Ftextarea><\u002Flabel>\n  <div class=\"row\" style=\"margin-top:8px\"><button class=\"green\" id=\"evSave\">${ev?'Save changes':'Create event'}<\u002Fbutton>${ev?'<button id=\"evCancel\">Cancel edit<\u002Fbutton>':''}<\u002Fdiv>\n  <h3 style=\"margin-top:24px\">Events (${S.events.length})<\u002Fh3>\n  <div id=\"evList\">${S.events.map(e=>`<div class=\"list-item\"><div class=\"grow\"><b>${sportIcon(e.sport_type)} ${esc(e.name)}<\u002Fb> <span class=\"tag\">${esc(e.sport_type||'')}<\u002Fspan><span class=\"tag\">${esc(e.unit_label||'')}<\u002Fspan><span class=\"tag\">${e.scoring_mode==='lowest_wins'?'Fastest Time Wins':'Best Score Wins'}<\u002Fspan><span class=\"tag\">${e.max_attempts_per_student} attempts<\u002Fspan>${e.time_limit_minutes?`<span class=\"tag\">${e.time_limit_minutes} min<\u002Fspan>`:''}<div class=\"muted\">${esc(e.description||'')}<\u002Fdiv><\u002Fdiv>\n    <button class=\"small blue\" data-ed=\"${e.id}\">Edit<\u002Fbutton><button class=\"small red\" data-rm=\"${e.id}\">Delete<\u002Fbutton><\u002Fdiv>`).join('')||'<p class=\"muted\">No events yet.<\u002Fp>'}<\u002Fdiv>`;\n  if(ev)$('#evCancel').onclick=()=>{EV_EDIT=null;renderTeacher();};\n  $('#evSave').onclick=async()=>{const name=$('#evName').value.trim();if(!name){toast('Event name required','⚠️');return;}\n    const row={name,sport_type:$('#evSport').value||null,unit_label:$('#evUnit').value||null,scoring_mode:$('#evMode').value,max_attempts_per_student:Math.min(5,Math.max(1,+$('#evMax').value||5)),time_limit_minutes:+$('#evTime').value||null,description:$('#evDesc').value||null};\n    if(EV_EDIT)await upd('oly_events',`id=eq.${EV_EDIT}`,row);else await ins('oly_events',[row]);EV_EDIT=null;toast('Event saved','✅');renderTeacher();};\n  $('#evList').onclick=async e=>{const d=e.target.dataset;if(d.ed){EV_EDIT=d.ed;renderTeacher();}\n    if(d.rm&&await confirmBox('Delete this event and all its scores?')){await del('oly_events',`id=eq.${d.rm}`);await loadCore();await recalcMedals();renderTeacher();}};\n}\n\n/* ---- Scores ---- */\nlet SC_EL=null,SC_EV=null;\nasync function tScores(b){\n  const els=sortedElements();if(SC_EL==null)SC_EL=els[0]?els[0].name:'';\n  if(!SC_EV&&S.events[0])SC_EV=S.events[0].id;\n  const ev=S.events.find(e=>e.id===SC_EV);\n  b.innerHTML=`<div class=\"tabs\" id=\"scEls\">${els.map((e,i)=>`<button data-e=\"${esc(e.name)}\" class=\"${e.name===SC_EL?'active':''}\">${esc(e.name)}<\u002Fbutton>`).join('')}<button data-e=\"\" class=\"${SC_EL===''?'active':''}\">No Element<\u002Fbutton><\u002Fdiv>\n   <div class=\"row\" style=\"margin-bottom:12px\"><label>Event <select id=\"scEv\">${S.events.map(e=>`<option value=\"${e.id}\" ${e.id===SC_EV?'selected':''}>${esc(e.name)}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   ${ev?`<span class=\"tag\">${ev.scoring_mode==='lowest_wins'?'Lowest wins':'Highest wins'}<\u002Fspan><span class=\"tag\">${esc(ev.unit_label||'')}<\u002Fspan>`:''}<span class=\"muted\">Reorder Element tabs in Students or Settings.<\u002Fspan><\u002Fdiv>\n   <div id=\"scGrid\"><\u002Fdiv>`;\n  $('#scEls').onclick=e=>{const bb=e.target.closest('button');if(bb){SC_EL=bb.dataset.e;renderTeacher();}};\n  if($('#scEv'))$('#scEv').onchange=e=>{SC_EV=e.target.value;renderTeacher();};\n  if(!ev){$('#scGrid').innerHTML='<p class=\"muted\">Create an event first.<\u002Fp>';return;}\n  const studs=S.students.filter(s=>(s.class_name||'')===SC_EL);\n  const scores=await sel('oly_event_scores',`event_id=eq.${ev.id}&select=*`);\n  const max=ev.max_attempts_per_student||5,u=ev.unit_label||'';\n  $('#scGrid').innerHTML=studs.length?`<table><tr><th>Student<\u002Fth>${Array.from({length:max},(_,i)=>`<th>Attempt ${i+1}<\u002Fth>`).join('')}<th>Best<\u002Fth><th>Total / Avg<\u002Fth><\u002Ftr>\n   ${studs.map(s=>{const mine=scores.filter(x=>x.student_id===s.id);const vals=mine.map(x=>+x.score);const best=bestOf(vals,ev.scoring_mode);const tot=vals.reduce((a,b)=>a+b,0);\n    return `<tr><td><b>${esc(s.name)}<\u002Fb><\u002Ftd>${Array.from({length:max},(_,i)=>{const sc=mine.find(x=>x.attempt_number===i+1);\n     return `<td><button class=\"slot ${sc?'':'empty-slot'}\" data-s=\"${s.id}\" data-a=\"${i+1}\" data-v=\"${sc?sc.score:''}\">${sc?fmtScore(sc.score,u):'+ tap'}<\u002Fbutton><\u002Ftd>`;}).join('')}\n     <td><b>${fmtScore(best,u)}<\u002Fb><\u002Ftd><td>${vals.length?`${+tot.toFixed(2)} / ${+(tot/vals.length).toFixed(2)}`:'—'}<\u002Ftd><\u002Ftr>`;}).join('')}<\u002Ftable>`:'<p class=\"muted\">No students in this Element.<\u002Fp>';\n  $('#scGrid').onclick=e=>{const sl=e.target.closest('.slot');if(sl)openNumpad(S.students.find(s=>s.id===sl.dataset.s),ev,+sl.dataset.a,sl.dataset.v);};\n}\nfunction openNumpad(student,ev,attempt,cur,onSaved){\n  let val=cur||'';\n  const o=openOverlay(`<div class=\"modal\" style=\"max-width:460px\"><h2 style=\"font-size:1.3rem\">${esc(student.name)} · ${esc(ev.name)} · Attempt ${attempt}<\u002Fh2>\n   <div class=\"numpad-display\"><span id=\"npVal\"><\u002Fspan> <small style=\"font-size:1rem\">${esc(ev.unit_label||'')}<\u002Fsmall><\u002Fdiv>\n   <div class=\"numpad\">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button data-k=\"${k}\">${k}<\u002Fbutton>`).join('')}<\u002Fdiv>\n   <div class=\"row\" style=\"margin-top:14px\"><button class=\"small\" data-k=\"cancel\">Cancel<\u002Fbutton>${cur?'<button class=\"small red\" data-k=\"clear\">Delete score<\u002Fbutton>':''}<button class=\"green grow\" data-k=\"ok\" style=\"min-height:70px;font-size:1.5rem\">Confirm ✓<\u002Fbutton><\u002Fdiv><\u002Fdiv>`);\n  const show=()=>o.querySelector('#npVal').textContent=val||'0';show();\n  o.onclick=async e=>{const k=e.target.closest('button')?.dataset.k;if(!k)return;SFX.click();\n    if(k==='cancel'){o.remove();return;}\n    if(k==='⌫')val=val.slice(0,-1);else if(k==='.'){if(!val.includes('.'))val=(val||'0')+'.';}\n    else if(/\\d/.test(k)){if(val.length<8)val+=k;}\n    else if(k==='clear'){await del('oly_event_scores',`student_id=eq.${student.id}&event_id=eq.${ev.id}&attempt_number=eq.${attempt}`);o.remove();onSaved?await onSaved():await afterScore(student);return;}\n    else if(k==='ok'){if(val===''||isNaN(+val))return;\n      await ins('oly_event_scores',[{student_id:student.id,event_id:ev.id,attempt_number:attempt,score:+val}],{onConflict:'student_id,event_id,attempt_number',upsert:true});\n      o.remove();onSaved?await onSaved():await afterScore(student);return;}\n    show();};\n}\nasync function afterScore(student,noTeacher){\n  await recalcMedals();\n  await loadStudent(student.id);await checkAchievements();\n  if(!noTeacher)renderTeacher();\n}\n\n/* ---- Analytics ---- */\nconst AN={student:'',element:'',grade:'',from:'',to:'',sport:''};\nasync function tAnalytics(b){\n  const [responses,caught,sachs,scores,xpRows]=await Promise.all([selAll('oly_responses','select=student_id,question_id,answer_given,is_correct,xp_earned,created_at,skill_level,prompt,correct_text,time_ms&order=created_at'),\n    selAll('oly_student_pokemon','select=student_id,caught_date'),selAll('oly_student_achievements','select=student_id,achievement_id,unlocked_date'),\n    selAll('oly_event_scores','select=student_id,event_id,score'),sel('oly_student_xp','select=student_id,total_xp,math_level')]);\n  const sports=[...new Set(S.events.map(e=>e.sport_type).filter(Boolean))];\n  const grades=[...new Set(S.students.map(s=>studentGrade(s)).filter(Boolean))];\n  b.innerHTML=`<div class=\"row\" style=\"margin-bottom:12px\">\n   <label>Student <select id=\"anS\"><option value=\"\">All<\u002Foption>${S.students.map(s=>`<option value=\"${s.id}\" ${AN.student===s.id?'selected':''}>${esc(s.name)}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <label>Element <select id=\"anE\"><option value=\"\">All<\u002Foption>${sortedElements().map(e=>`<option ${AN.element===e.name?'selected':''}>${esc(e.name)}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <label>Grade <select id=\"anG\"><option value=\"\">All<\u002Foption>${grades.map(g=>`<option value=\"${g}\" ${AN.grade===g?'selected':''}>${g==='K'?'Kindergarten':'Grade '+g}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <label>From <input type=\"date\" id=\"anF\" value=\"${AN.from}\"><\u002Flabel><label>To <input type=\"date\" id=\"anT\" value=\"${AN.to}\"><\u002Flabel>\n   <label>Event type <select id=\"anSp\"><option value=\"\">All<\u002Foption>${sports.map(s=>`<option ${AN.sport===s?'selected':''}>${esc(s)}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel><\u002Fdiv>\n   <div class=\"legend\"><span><i style=\"background:#2f9be8\"><\u002Fi>XP<\u002Fspan><span><i style=\"background:#d8262c\"><\u002Fi>Catches<\u002Fspan><span><i style=\"background:#f6c935\"><\u002Fi>Achievements<\u002Fspan><span><i style=\"background:#3fbf5f\"><\u002Fi>Level-ups<\u002Fspan><span class=\"muted\">(each line scaled to its own max — values in table below)<\u002Fspan><\u002Fdiv>\n   <canvas class=\"chart\" id=\"anChart\"><\u002Fcanvas><div id=\"anTotals\" style=\"margin:8px 0 20px\"><\u002Fdiv>\n   <div class=\"row\" style=\"align-items:flex-start;gap:24px\"><div class=\"grow\" style=\"min-width:340px\"><h3>Missed questions<\u002Fh3><div id=\"anMissed\" style=\"max-height:400px;overflow:auto\"><\u002Fdiv><\u002Fdiv>\n   <div class=\"grow\" style=\"min-width:280px\"><h3>Weak skill areas<\u002Fh3><div id=\"anSkills\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n   <h3>Math ladder<\u002Fh3><div id=\"anMath\"><\u002Fdiv>\n   <h3>Event performance (average best score by Element)<\u002Fh3><div id=\"anEvents\"><\u002Fdiv>`;\n  ['anS','anE','anG','anF','anT','anSp'].forEach((id,i)=>$('#'+id).onchange=e=>{AN[['student','element','grade','from','to','sport'][i]]=e.target.value;tAnalytics(b);});\n  const studs=S.students.filter(s=>(!AN.student||s.id===AN.student)&&(!AN.element||s.class_name===AN.element)&&(!AN.grade||studentGrade(s)===AN.grade));\n  const ids=new Set(studs.map(s=>s.id));\n  const from=AN.from?+new Date(AN.from):-Infinity,to=AN.to?+new Date(AN.to)+86400000:Infinity;\n  const inR=t=>t>=from&&t<to;\n  const achXP={};S.achievements.forEach(a=>achXP[a.id]=a.xp_reward||0);\n  const xpEv=[],cEv=[],aEv=[],lEv=[];\n  studs.forEach(s=>{\n    const ev=[...responses.filter(r=>r.student_id===s.id&&r.xp_earned>0).map(r=>({t:+new Date(r.created_at),v:r.xp_earned})),\n      ...sachs.filter(a=>a.student_id===s.id&&achXP[a.achievement_id]).map(a=>({t:+new Date(a.unlocked_date),v:achXP[a.achievement_id]}))].sort((a,b)=>a.t-b.t);\n    let sum=0,lvl=1;ev.forEach(e=>{sum+=e.v;const nl=levelFor(sum).n;if(nl>lvl){for(let k=lvl;k<nl;k++)lEv.push({t:e.t,v:1});lvl=nl;}});\n    xpEv.push(...ev);\n  });\n  caught.filter(c=>ids.has(c.student_id)).forEach(c=>cEv.push({t:+new Date(c.caught_date),v:1}));\n  sachs.filter(a=>ids.has(a.student_id)).forEach(a=>aEv.push({t:+new Date(a.unlocked_date),v:1}));\n  const series=[['#2f9be8',xpEv],['#d8262c',cEv],['#f6c935',aEv],['#3fbf5f',lEv]].map(([color,ev])=>({color,points:cumulative(ev).filter(p=>inR(p[0]))}));\n  drawChart($('#anChart'),series,{normalize:true});\n  const last=s=>s.points.length?s.points[s.points.length-1][1]:0;\n  $('#anTotals').innerHTML=`<span class=\"tag\">XP: ${last(series[0])}<\u002Fspan><span class=\"tag\">Catches: ${last(series[1])}<\u002Fspan><span class=\"tag\">Achievements: ${last(series[2])}<\u002Fspan><span class=\"tag\">Level-ups: ${last(series[3])}<\u002Fspan><span class=\"tag\">Students: ${studs.length}<\u002Fspan>`;\n  const wrong=responses.filter(r=>!r.is_correct&&ids.has(r.student_id)&&inR(+new Date(r.created_at)));\n  const qBy={};S.questions.forEach(q=>qBy[q.id]=q);\n  $('#anMissed').innerHTML=wrong.length?`<table><tr><th>Student<\u002Fth><th>Question<\u002Fth><th>Their answer<\u002Fth><th>Correct<\u002Fth><\u002Ftr>${wrong.slice(-300).reverse().map(r=>{const q=qBy[r.question_id]||{};\n    return `<tr><td>${esc(studentName(r.student_id))}<\u002Ftd><td>${esc(r.prompt||q.content||'(deleted)')}<\u002Ftd><td style=\"color:#9e1218\">${esc(r.answer_given)}<\u002Ftd><td style=\"color:#16692d\">${esc(r.correct_text||q.correct_answer||'')}<\u002Ftd><\u002Ftr>`;}).join('')}<\u002Ftable>`:'<p class=\"muted\">No missed questions 🎉<\u002Fp>';\n  const sk={};wrong.forEach(r=>{const q=qBy[r.question_id];const t=r.skill_level?`Math ${r.skill_level}: ${MATH_LEVELS[r.skill_level].name}`:(q&&(q.skill_tag||q.subject))||'untagged';(sk[t]=sk[t]||{n:0,s:new Set()});sk[t].n++;sk[t].s.add(r.student_id);});\n  $('#anSkills').innerHTML=Object.keys(sk).length?Object.entries(sk).sort((a,b)=>b[1].s.size-a[1].s.size).map(([t,v])=>`<div class=\"list-item\"><b class=\"grow\">${esc(t)}<\u002Fb><span>${v.s.size} student${v.s.size>1?'s':''} struggling · ${v.n} misses<\u002Fspan><\u002Fdiv>`).join(''):'<p class=\"muted\">Nothing to flag.<\u002Fp>';\n  const xpL={};xpRows.forEach(x=>xpL[x.student_id]=x.math_level);\n  const mr=responses.filter(r=>r.skill_level&&ids.has(r.student_id)&&inR(+new Date(r.created_at)));\n  const byL={};mr.forEach(r=>{const o=(byL[r.skill_level]=byL[r.skill_level]||{n:0,c:0,t:0,tn:0,s:new Set()});o.n++;if(r.is_correct)o.c++;if(r.time_ms){o.t+=r.time_ms;o.tn++;}o.s.add(r.student_id);});\n  const curL={};studs.forEach(s=>{const l=xpL[s.id]||START_LEVEL[studentGrade(s)]||6;(curL[l]=curL[l]||[]).push(s.name);});\n  $('#anMath').innerHTML=`<table><tr><th>Level<\u002Fth><th>Skill<\u002Fth><th>Students here now<\u002Fth><th>Answers<\u002Fth><th>Accuracy<\u002Fth><th>Avg time<\u002Fth><\u002Ftr>${MATH_LEVELS.slice(1).map((L,i)=>{const l=i+1,o=byL[l];\n    return `<tr><td><b>${l}<\u002Fb><\u002Ftd><td>${esc(L.name)} <span class=\"muted\">${L.teks}<\u002Fspan><\u002Ftd><td>${(curL[l]||[]).map(esc).join(', ')||'—'}<\u002Ftd><td>${o?o.n:0}<\u002Ftd><td>${o?Math.round(o.c/o.n*100)+'%':'—'}<\u002Ftd><td>${o&&o.tn?(o.t/o.tn/1000).toFixed(1)+'s':'—'}<\u002Ftd><\u002Ftr>`;}).join('')}<\u002Ftable>`;\n  const evs=S.events.filter(e=>!AN.sport||e.sport_type===AN.sport);const els=sortedElements().map(e=>e.name);\n  $('#anEvents').innerHTML=evs.length?`<table><tr><th>Event<\u002Fth>${els.map(e=>`<th>${esc(e)}<\u002Fth>`).join('')}<\u002Ftr>${evs.map(ev=>`<tr><td><b>${esc(ev.name)}<\u002Fb> <span class=\"muted\">${esc(ev.unit_label||'')}<\u002Fspan><\u002Ftd>${els.map(el=>{\n    const bests=S.students.filter(s=>s.class_name===el&&ids.has(s.id)).map(s=>bestOf(scores.filter(x=>x.student_id===s.id&&x.event_id===ev.id).map(x=>+x.score),ev.scoring_mode)).filter(x=>x!=null);\n    return `<td>${bests.length?+(bests.reduce((a,b)=>a+b,0)/bests.length).toFixed(2):'—'}<\u002Ftd>`;}).join('')}<\u002Ftr>`).join('')}<\u002Ftable>`:'<p class=\"muted\">No events.<\u002Fp>';\n}\n\n/* ---- Goals (teacher) ---- */\nasync function tGoals(b){\n  const [goals,sg,xps,caught,scores]=await Promise.all([sel('oly_goals','select=*&order=created_at.desc'),selAll('oly_student_goals','select=*'),\n    sel('oly_student_xp','select=*'),selAll('oly_student_pokemon','select=student_id'),selAll('oly_event_scores','select=student_id,event_id')]);\n  const grades=[...new Set(S.students.map(s=>studentGrade(s)).filter(Boolean))];\n  const liveStats=s=>{const x=xps.find(r=>r.student_id===s.id)||{};const sc=scores.filter(r=>r.student_id===s.id);const per={};sc.forEach(r=>per[r.event_id]=(per[r.event_id]||0)+1);\n    return {xp:x.total_xp||0,caught:caught.filter(c=>c.student_id===s.id).length,completed:Object.entries(per).filter(([e,n])=>n>=((S.events.find(v=>v.id===e)||{}).max_attempts_per_student||5)).length,level:x.level||1,best:x.best_streak||0};};\n  b.innerHTML=`<h3>Create a goal<\u002Fh3><div class=\"form-grid\">\n   <label>Goal type<select id=\"gType\">${Object.entries(GOAL_TYPES).map(([k,v])=>`<option value=\"${k}\">${v}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n   <label>Target<input id=\"gTarget\" type=\"number\" min=\"1\" placeholder=\"e.g. 500\"><\u002Flabel>\n   <label>Title (optional)<input id=\"gTitle\" placeholder=\"Auto-generated if blank\"><\u002Flabel>\n   <label>Scope<select id=\"gScope\"><option value=\"individual\">Individual student<\u002Foption><option value=\"element\">Element (class)<\u002Foption><option value=\"grade\">Grade level<\u002Foption><\u002Fselect><\u002Flabel>\n   <label>Who<select id=\"gWho\"><\u002Fselect><\u002Flabel><\u002Fdiv><button class=\"green\" id=\"gAdd\">Create goal<\u002Fbutton>\n   <h3 style=\"margin-top:24px\">Goals<\u002Fh3><div id=\"gList\"><\u002Fdiv>`;\n  const fillWho=()=>{const sc=$('#gScope').value;$('#gWho').innerHTML=sc==='individual'?S.students.map(s=>`<option value=\"${s.id}\">${esc(s.name)}<\u002Foption>`).join(''):sc==='element'?elementOptions('',false):grades.map(g=>`<option value=\"${g}\">${g==='K'?'Kindergarten':'Grade '+g}<\u002Foption>`).join('');};\n  fillWho();$('#gScope').onchange=fillWho;\n  $('#gAdd').onclick=async()=>{const t=$('#gType').value,val=+$('#gTarget').value;if(!val||!$('#gWho').value){toast('Target and who are required','⚠️');return;}\n    const auto={xp:`Earn ${val} XP`,catch:`Catch ${val} Pokémon`,event:`Complete ${val} events`,level:`Reach ${(levelInfo(val)||{}).name}`,streak:`Get ${val} correct in a row`}[t];\n    await ins('oly_goals',[{title:$('#gTitle').value||auto,goal_type:t,target_value:val,scope:$('#gScope').value,scope_value:$('#gWho').value,created_by:'teacher'}]);renderTeacher();};\n  $('#gList').innerHTML=goals.length?goals.map(g=>{const studs=goalsForStudentsOf(g);\n    const scopeLabel=g.scope==='individual'?studentName(g.scope_value):g.scope==='element'?'Element '+g.scope_value:(g.scope_value==='K'?'Kindergarten':'Grade '+g.scope_value);\n    return `<div class=\"list-item\" style=\"display:block\"><div class=\"row\"><b class=\"grow\">${esc(g.title)}<\u002Fb><span class=\"tag\">${GOAL_TYPES[g.goal_type]||g.goal_type}<\u002Fspan><span class=\"tag el\">${esc(scopeLabel)}<\u002Fspan><span class=\"tag\">by ${esc(g.created_by)}<\u002Fspan><button class=\"small red\" data-rm=\"${g.id}\">Delete<\u002Fbutton><\u002Fdiv>\n      ${studs.map(s=>{const cur=goalValue(g.goal_type,liveStats(s)),pc=Math.min(100,cur/(+g.target_value||1)*100);\n        return `<div class=\"row\" style=\"margin-top:6px\"><span style=\"width:160px\">${pc>=100?'✅':''} ${esc(s.name)}<\u002Fspan><div class=\"bar grow\" style=\"height:16px;border-width:2px\"><i style=\"width:${pc}%\"><\u002Fi><\u002Fdiv><span style=\"width:90px;text-align:right\">${cur}/${+g.target_value}<\u002Fspan><\u002Fdiv>`;}).join('')}<\u002Fdiv>`;}).join(''):'<p class=\"muted\">No goals yet.<\u002Fp>';\n  $('#gList').onclick=async e=>{const id=e.target.dataset.rm;if(id&&await confirmBox('Delete this goal?')){await del('oly_goals',`id=eq.${id}`);renderTeacher();}};\n}\nfunction goalsForStudentsOf(g){return S.students.filter(s=>goalsForStudent(s,[g]).length);}\n\n/* ---- Settings ---- */\nasync function tSettings(b){\n  const def=S.settings.find(s=>s.element_name==='DEFAULT');\n  const overrides=S.settings.filter(s=>s.element_name!=='DEFAULT');\n  const avail=sortedElements().filter(e=>!overrides.find(o=>o.element_name===e.name));\n  b.innerHTML=`<h3>Ball costs & catch rate<\u002Fh3><p class=\"muted\">Changes save instantly. Elements without an override use DEFAULT.<\u002Fp>\n   <table id=\"setTbl\"><tr><th>Element<\u002Fth><th>Poké Ball cost (XP)<\u002Fth><th>Great Ball cost (XP)<\u002Fth><th>Catch rate (%)<\u002Fth><th><\u002Fth><\u002Ftr>\n   ${[def,...overrides].filter(Boolean).map(s=>`<tr><td><b>${esc(s.element_name)}<\u002Fb><\u002Ftd>\n     <td><input type=\"number\" data-id=\"${s.id}\" data-f=\"pokeball_cost\" value=\"${s.pokeball_cost}\"><\u002Ftd>\n     <td><input type=\"number\" data-id=\"${s.id}\" data-f=\"greatball_cost\" value=\"${s.greatball_cost}\"><\u002Ftd>\n     <td><input type=\"number\" data-id=\"${s.id}\" data-f=\"catch_rate\" value=\"${s.catch_rate}\"><\u002Ftd>\n     <td>${s.element_name==='DEFAULT'?'<span class=\"muted\">always on<\u002Fspan>':`<button class=\"small red\" data-rm=\"${s.id}\">Remove<\u002Fbutton>`}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftable>\n   <div class=\"row\" style=\"margin-top:8px\"><select id=\"setNewEl\">${avail.map(e=>`<option>${esc(e.name)}<\u002Foption>`).join('')}<\u002Fselect><button class=\"blue\" id=\"setAdd\" ${avail.length?'':'disabled'}>Add Element override<\u002Fbutton><\u002Fdiv>\n   <h3 style=\"margin-top:24px\">XP multiplier<\u002Fh3><div class=\"row\"><input type=\"number\" id=\"setMult\" step=\"0.5\" min=\"0\" value=\"${def?def.xp_multiplier:1}\" style=\"width:120px\"><span>× on all XP gains (e.g. 10 for Project Week, 1 for normal PE)<\u002Fspan><\u002Fdiv>\n   <h3 style=\"margin-top:24px\">Encounter pool<\u002Fh3><button class=\"red\" id=\"setReset\">Reset All Encounters<\u002Fbutton> <span class=\"muted\">Missed Pokémon (incl. legendaries) can appear again. Caught Pokémon never re-appear.<\u002Fspan>\n   <h3 style=\"margin-top:24px\">Pokémon audio<\u002Fh3><div class=\"row\"><input type=\"number\" id=\"audNum\" placeholder=\"Pokédex #\" style=\"width:140px\"><input type=\"file\" id=\"audFile\" accept=\"audio/*\"><button class=\"blue\" id=\"audUp\">Upload<\u002Fbutton><span id=\"audRes\"><\u002Fspan><\u002Fdiv>\n   <h3 style=\"margin-top:24px\">Catch / escape videos<\u002Fh3>\n   <div class=\"row\"><select id=\"vidType\"><option value=\"catch_success\">catch_success<\u002Foption><option value=\"catch_fail\">catch_fail<\u002Foption><\u002Fselect><input id=\"vidUrl\" class=\"grow\" placeholder=\"https://… .mp4 or YouTube link\"><button class=\"blue\" id=\"vidAdd\">Add video<\u002Fbutton><\u002Fdiv>\n   <div id=\"vidList\" style=\"margin-top:8px\">${S.media.map(m=>`<div class=\"list-item\"><span class=\"tag ${m.media_type==='catch_success'?'el':''}\">${esc(m.media_type)}<\u002Fspan><span class=\"grow\" style=\"word-break:break-all\">${esc(m.video_url)}<\u002Fspan><button class=\"small red\" data-rm=\"${m.id}\">Delete<\u002Fbutton><\u002Fdiv>`).join('')||'<p class=\"muted\">No videos yet.<\u002Fp>'}<\u002Fdiv>\n   <div style=\"margin-top:24px\">${elementsManagerHTML()}<\u002Fdiv>`;\n  $('#setTbl').onchange=async e=>{const d=e.target.dataset;if(!d.id)return;await upd('oly_settings',`id=eq.${d.id}`,{[d.f]:+e.target.value});const s=S.settings.find(x=>x.id===d.id);s[d.f]=+e.target.value;toast('Saved','✅');};\n  $('#setTbl').onclick=async e=>{const id=e.target.dataset.rm;if(id&&await confirmBox('Remove this override?')){await del('oly_settings',`id=eq.${id}`);renderTeacher();}};\n  $('#setAdd').onclick=async()=>{const n=$('#setNewEl').value;if(!n)return;await ins('oly_settings',[{element_name:n,pokeball_cost:def.pokeball_cost,greatball_cost:def.greatball_cost,catch_rate:def.catch_rate,xp_multiplier:def.xp_multiplier}]);renderTeacher();};\n  $('#setMult').onchange=async e=>{await upd('oly_settings',`id=eq.${def.id}`,{xp_multiplier:+e.target.value||1});def.xp_multiplier=+e.target.value||1;toast(`XP multiplier is now ${def.xp_multiplier}×`,'✨');};\n  $('#setReset').onclick=async()=>{if(!await confirmBox('Reset encounters for ALL students? Missed Pokémon can show up again. Caught Pokémon stay caught.'))return;\n    await del('oly_throws','caught=eq.false');toast('Encounters reset!','🔄');};\n  $('#audUp').onclick=async()=>{const n=+$('#audNum').value,f=$('#audFile').files[0];const p=S.pokemon.find(x=>x.pokedex_id===n);\n    if(!p||!f){$('#audRes').textContent='Enter a valid Pokédex # and choose a file.';return;}\n    $('#audRes').textContent='Uploading…';\n    const ext=(f.name.split('.').pop()||'mp3').toLowerCase(),path=`${String(n).padStart(4,'0')}.${ext}`;\n    const r=await fetch(`${SB_URL}/storage/v1/object/pokemon-audio/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'x-upsert':'true','Content-Type':f.type||'audio/mpeg'},body:f});\n    if(!r.ok){$('#audRes').textContent='Upload failed: '+await r.text();return;}\n    const url=`${SB_URL}/storage/v1/object/public/pokemon-audio/${path}?v=${Date.now()}`;\n    await upd('pokemon',`id=eq.${p.id}`,{audio_url:url});p.audio_url=url;$('#audRes').textContent=`✅ ${p.name} audio saved`;playAudio(url);};\n  $('#vidAdd').onclick=async()=>{const u=$('#vidUrl').value.trim();if(!u)return;await ins('oly_media',[{media_type:$('#vidType').value,video_url:u}]);renderTeacher();};\n  $('#vidList').onclick=async e=>{const id=e.target.dataset.rm;if(id){await del('oly_media',`id=eq.${id}`);renderTeacher();}};\n  bindElementsManager(renderTeacher);\n}\n\n/* ============================================================\n   BOOT\n   ============================================================ */\n(async function boot(){\n  try{\n    await loadCore();\n    await seedAchievements();\n    renderDex();\n    await loadPokemon();\n    await loadDexCatches();\n    renderDex();\n    setInterval(pollCatches,5000);\n  }catch(err){\n    console.error(err);\n    const b=$('#dbBanner');b.classList.remove('hidden');\n    b.innerHTML=`⚠️ Could not load the database. If this is a fresh setup, run <b>olympics_v2_schema.sql<\u002Fb> in Supabase first.<br><small>${esc(err.message)}<\u002Fsmall>`;\n  }\n})();\n<\u002Fscript>\n<script>\n/* ============================================================\n   v3 ADD-ONS (overrides earlier functions by reassignment)\n   ============================================================ */\nconst FALLBACK_VIDEO={catch_success:'https://aiczpuoskwzqtzvoomll.supabase.co/storage/v1/object/public/oly-media/catch.mp4',catch_fail:'https://aiczpuoskwzqtzvoomll.supabase.co/storage/v1/object/public/oly-media/escape.mp4'};\nconst DEX_THEMES={Red:['#c8242b','#7d1015','#ee5a52'],Blue:['#2a6fd6','#123d85','#5aa0f5'],Yellow:['#e9b81f','#9a7408','#ffd95a'],Green:['#2f9e4f','#175e2b','#5fd07c'],\n  Purple:['#7c3fc4','#43207a','#a874ef'],Pink:['#e2559b','#93285e','#ff8cc4'],Black:['#2a2a2e','#0e0e10','#4a4a52'],Silver:['#a9adb4','#6a6e75','#dfe2e6']};\nconst SPORT_TYPES={Basketball:['#f08a24','#7a3a00'],Soccer:['#3fbf5f','#0f5a25'],Disc:['#2fb3e8','#0b4e78'],Accuracy:['#d8262c','#6d0d10'],Track:['#f6c935','#7a5a00'],Field:['#a0743f','#4a2f10'],Fitness:['#9b59d0','#3e1764'],Other:['#8a8f98','#33363b']};\nconst PARENT_MSGS=[\n f=>`${f} has been working hard at BASIS Olympics! Every practice question and every event try helped ${f} grow stronger, faster and smarter.`,\n f=>`What a season for ${f}! We loved watching ${f} cheer on classmates, keep trying, and celebrate each new personal best.`,\n f=>`${f} showed real grit this Olympics. Some tries were tough, and ${f} kept going anyway, which is exactly what champions do.`,\n f=>`Math and movement went hand in hand for ${f} this term. Ask ${f} to tell you about a favorite Pokémon catch!`,\n f=>`${f} brought great energy to every event. Ask ${f} which event felt like the biggest improvement.`,\n f=>`Practice really paid off for ${f}. Quick, careful math answers earned the XP that filled ${f}'s Pokédex.`,\n f=>`${f} learned that small steps add up. Each try, each question and each catch is a step ${f} can be proud of.`,\n f=>`We are proud of how ${f} set goals and chased them this Olympics. Keep asking ${f} about the next goal at home!`,\n f=>`${f} was a wonderful teammate. Kindness, effort and good sportsmanship made ${f} a true Olympian.`,\n f=>`Every medal, catch and correct answer on these pages belongs to ${f}. Thank you for supporting ${f} at home.`,\n f=>`${f} kept a positive attitude all season. Practicing math facts at home will help ${f} catch even more next time!`,\n f=>`From the first try to the last, ${f} kept improving. We can't wait to see what ${f} does next!`];\n\n/* ---------- settings ---------- */\nconst defSet=()=>S.settings.find(s=>s.element_name==='DEFAULT')||{};\nconst cfg=k=>{const d=defSet();const D={event_xp_attempt:5,event_xp_pb:10,event_xp_medal:25,celebration_level:'medium',sounds_muted:false,shiny_chance:0.05};return d[k]??D[k];};\nconst celebF=()=>({calm:.35,medium:1,big:1.8}[cfg('celebration_level')]||1);\n\n/* ---------- graceful writes when migration not yet run ---------- */\nconst V3_COLS=['encounter_id','ball_cost','xp_after','xp_multiplier','is_shiny','xp_earned','dex_color','favorite_sport','favorite_pokemon_id'];\nfunction migWarn(){if(S.noMig)return;S.noMig=true;const b=$('#dbBanner');b.classList.remove('hidden');b.innerHTML='⚠️ New v3 columns are missing. Run <b>olympics_v3_migration.sql<\u002Fb> in Supabase so catch stories, event XP and themes save.';}\nasync function insSafe(t,rows,opts){\n  try{return await ins(t,rows,opts);}catch(e){if(!/column|schema cache/i.test(e.message))throw e;migWarn();\n    return await ins(t,rows.map(r=>{const o={...r};V3_COLS.forEach(k=>delete o[k]);return o;}),opts);}\n}\nasync function updSafe(t,f,p){try{return await upd(t,f,p);}catch(e){if(/column|schema cache/i.test(e.message)){migWarn();return null;}throw e;}}\n\n/* ---------- sound + celebration intensity ---------- */\nconst _tone=tone;tone=function(f,d,t,w,v=.18){if(cfg('sounds_muted'))return;_tone(f,d,t,w,v*(cfg('celebration_level')==='calm'?.5:cfg('celebration_level')==='big'?1.3:1));};\nconst _play=playAudio;playAudio=function(u){if(cfg('sounds_muted'))return;_play(u);};\nconst _conf=confetti;confetti=function(n=90){_conf(Math.round(n*celebF()));};\nSFX.sparkle=()=>[1568,2093,2637,3136].forEach((f,i)=>tone(f,.12,'triangle',i*.07,.08));\nSFX.fanfare2=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.28,'square',i*.13,.09));\n\n/* full-screen level-up fanfare */\nnextCeleb=function(){\n  const it=celebQ.shift();if(!it){celebBusy=false;return;}celebBusy=true;\n  let o;\n  if(it.kind==='level'){\n    SFX.fanfare2();confetti(200);\n    o=document.createElement('div');o.className='fanfare';\n    o.innerHTML=`<div class=\"rays\"><\u002Fdiv><div class=\"big\">LEVEL ${it.level}!<\u002Fdiv><div class=\"sub\">${esc(it.student)} is now <b>${esc(LEVELS[it.level-1].name)}<\u002Fb>${LEG_LEVELS.includes(it.level)?'<br>🌟 A LEGENDARY Pokémon awaits!':''}<\u002Fdiv><div class=\"sub\" style=\"font-size:1.1rem;opacity:.7\">tap to continue<\u002Fdiv>`;\n    document.body.appendChild(o);\n  }else{\n    SFX.fanfare();confetti();\n    o=openOverlay(`<div class=\"ach-pop\"><div class=\"bungee\" style=\"color:#9e1218\">${it.kind==='goal'?'Goal Complete!':'Achievement Unlocked!'}<\u002Fdiv><div class=\"ic\">${esc(it.icon||'🏆')}<\u002Fdiv><h2>${esc(it.name)}<\u002Fh2><p style=\"font-size:1.2rem\">${esc(it.description||'')}<\u002Fp>${it.xp?`<p class=\"bungee\" style=\"color:#3fbf5f\">+${it.xp} XP<\u002Fp>`:''}<p class=\"muted\">${esc(it.student||'')}<\u002Fp><\u002Fdiv>`);\n  }\n  let done=false;const fin=()=>{if(done)return;done=true;o.remove();setTimeout(nextCeleb,250);};\n  o.onclick=fin;setTimeout(fin,it.kind==='level'?5500:4000);\n};\n\n/* ---------- region background ---------- */\n(function(){const b=document.createElement('div');b.id='bgfx';b.innerHTML=Array.from({length:10},(_,i)=>`<i class=\"r${i}${i===0?' on':''}\"><\u002Fi>`).join('');document.body.prepend(b);})();\nfunction setRegionBg(r){document.querySelectorAll('#bgfx>i').forEach((x,i)=>x.classList.toggle('on',i===(r||0)));}\n\n/* ---------- encounter linking ---------- */\nlet CUR_ENC=null;\nconst uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});\nlogResponse=async function(q,given,ok){\n  const ms=q._t0?Math.round(performance.now()-q._t0):null;\n  const row={student_id:ST.s.id,question_id:q.id||null,answer_given:String(given),is_correct:ok,xp_earned:0,skill_level:q.gen?q.level:null,prompt:q.content,correct_text:q.correct_answer,time_ms:ms};\n  if(ENC&&CUR_ENC&&!ENC.done)row.encounter_id=CUR_ENC.id;\n  const r=await insSafe('oly_responses',[row]);ST.responses.push(r[0]);await updateStreak(ok);return r[0];\n};\nlogThrows=async function(list,answered,caught){\n  if(!list.length)return;\n  const r=await insSafe('oly_throws',list.map(p=>({student_id:ST.s.id,pokemon_id:p.id,ball_type:ENC.ball,question_id:ENC.q&&ENC.q.id,answered_correctly:answered,caught,encounter_id:CUR_ENC&&CUR_ENC.id})));\n  ST.throws.push(...(r||[]));\n};\nstartEncounter=function(){\n  const set=settingsFor(ST.s.class_name),w=wallet();\n  const o=openOverlay(`<div class=\"modal\"><h2>Choose your ball!<\u002Fh2>\n    <div class=\"ball-choice\">\n      <button data-b=\"pokeball\" ${w<set.pokeball_cost?'disabled':''}><div class=\"pball\"><\u002Fdiv>Poké Ball<span class=\"bungee\">${set.pokeball_cost} XP<\u002Fspan><small>One try<\u002Fsmall><\u002Fbutton>\n      <button data-b=\"greatball\" ${w<set.greatball_cost?'disabled':''}><div class=\"pball great\"><\u002Fdiv>Great Ball<span class=\"bungee\">${set.greatball_cost} XP<\u002Fspan><small>One extra chance!<\u002Fsmall><\u002Fbutton>\n    <\u002Fdiv><p style=\"text-align:center;font-size:1.2rem\">You have <b>${w} XP<\u002Fb> to spend<\u002Fp>\n    <div style=\"text-align:center\"><button data-b=\"cancel\">Not now<\u002Fbutton><\u002Fdiv><\u002Fdiv>`);\n  o.onclick=async e=>{\n    const b=e.target.closest('button')?.dataset.b;if(!b)return;if(b==='cancel'){o.close();return;}\n    const cost=b==='greatball'?set.greatball_cost:set.pokeball_cost;\n    if(wallet()<cost){toast('Not enough XP for that ball!','❌');o.close();return;}\n    o.remove();SFX.click();\n    await saveXP({xp_spent:(ST.xp.xp_spent||0)+cost});\n    CUR_ENC={id:uuid(),cost,mult:multiplier()};\n    beginEncounter(b);\n  };\n};\nencounterWin=async function(n){\n  ENC.done=true;clearInterval(ENC.timer);\n  const won=ENC.ps.slice(0,Math.max(1,n));\n  const shiny=won.map(()=>Math.random()<Number(cfg('shiny_chance')));\n  const xpAfter=wallet();\n  const r=await insSafe('oly_student_pokemon',won.map((p,i)=>({student_id:ST.s.id,pokemon_id:p.id,ball_type:ENC.ball,encounter_id:CUR_ENC&&CUR_ENC.id,ball_cost:CUR_ENC&&CUR_ENC.cost,xp_after:xpAfter,xp_multiplier:CUR_ENC?CUR_ENC.mult:multiplier(),is_shiny:shiny[i]})),{onConflict:'student_id,pokemon_id',ignore:true});\n  ST.caught.push(...(r||[]));\n  await logThrows(won,true,true);\n  won.forEach(p=>LOCAL_CATCH.add(ST.s.id+'|'+p.id));\n  await new Promise(r=>setTimeout(r,900));\n  ENC.overlay.remove();\n  const vid=await playVideo('catch_success',{keep:true});\n  await loadDexCatches();delete STORYC[ST.s.id];\n  S.currentStudent=ST.s.id;localStorage.setItem('oly_student',ST.s.id);\n  await showView('pokedex');\n  DEX.mode='my';DEX.student=ST.s.id;DEX.filter='caught';DEX.search='';DEX.region=0;won.forEach(p=>DEX.newIds.add(p.id));\n  renderDexBody();selectDex(won[won.length-1].id,false);\n  const reveal=showCardReveal(won,true,shiny);\n  vid&&vid.close();\n  await reveal;\n  selectDex(won[won.length-1].id,false);\n  toast(`${ST.s.name} caught ${won.map(p=>p.name).join(', ')}!`,'🎉');\n  ENC=null;CUR_ENC=null;\n  await checkAchievements();checkClassMilestones();\n};\nconst _lose=encounterLose;encounterLose=async function(){await _lose();CUR_ENC=null;};\n\nshowCardReveal=function(list,won,shiny=[]){\n  return new Promise(res=>{\n    const o=openOverlay(`<div class=\"reveal-wrap\"><h2 class=\"bungee reveal-title\" style=\"color:${won?'#ffd23d':'#ff6b6b'}\">${won?`You caught ${list.length} Pokémon!`:'These Pokémon got away…'}<\u002Fh2>\n      <div class=\"reveal-row\">${list.map((p,i)=>{const img=won?(p.card_image_large||p.card_image_small||p.image_url):p.image_url;\n        return `<div class=\"flip ${won?'':'lost'} ${shiny[i]?'shiny':''}\" style=\"--d:${i*.45}s\" data-big=\"${esc(img)}\">${shiny[i]?'<span class=\"shiny-tag\">✨ SHINY!<\u002Fspan>':''}<div class=\"flip-in\"><div class=\"flip-back\"><\u002Fdiv>\n          <div class=\"flip-front\">${won?`<img src=\"${esc(img)}\" alt=\"\">`:`<img src=\"${esc(img)}\" alt=\"\"><b>${esc(p.name)}<\u002Fb><span class=\"xmark\">✕<\u002Fspan>`}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;}).join('')}<\u002Fdiv>\n      <button class=\"${won?'green':'yellow'} reveal-btn\">${won?'Done ✓':'Try again next time ▶'}<\u002Fbutton><\u002Fdiv>`,{cls:'reveal-ov'});\n    o.style.zIndex=270;\n    list.forEach((p,i)=>setTimeout(()=>{SFX.click();if(won&&shiny[i])SFX.sparkle();},i*450+800));\n    setTimeout(()=>{won?(SFX.chime(),confetti(160)):SFX.buzz();},list.length*450+500);\n    if(won)list.forEach((p,i)=>setTimeout(()=>playAudio(p.audio_url),900+i*450));\n    o.onclick=e=>{\n      const f=e.target.closest('.flip');if(f&&won){const z=openOverlay(`<img src=\"${esc(f.dataset.big)}\" class=\"reveal\" style=\"max-height:92vh;max-width:92vw;border-radius:18px\">`);z.style.zIndex=280;z.onclick=()=>z.remove();return;}\n      if(e.target.closest('.reveal-btn')){o.remove();res();}\n    };\n  });\n};\nplayVideo=function(type,{keep}={}){\n  const vids=S.media.filter(m=>m.media_type===type&&m.video_url);\n  const url=vids.length?rand(vids).video_url:FALLBACK_VIDEO[type];if(!url)return Promise.resolve(null);\n  return new Promise(res=>{\n    const yt=url.match(/(?:youtube\\.com\\/watch\\?v=|youtu\\.be\\/)([\\w-]+)/);\n    const o=document.createElement('div');o.className='vid-ov';\n    o.innerHTML=yt?`<iframe src=\"https://www.youtube.com/embed/${yt[1]}?autoplay=1&controls=0&rel=0\" allow=\"autoplay\"><\u002Fiframe>`:`<video src=\"${esc(url)}\" playsinline preload=\"auto\"><\u002Fvideo>`;\n    o.insertAdjacentHTML('beforeend','<button class=\"vid-skip\">Skip ⏭<\u002Fbutton>');document.body.appendChild(o);\n    const handle={close:()=>o.remove()};let fin=false;\n    const done=()=>{if(fin)return;fin=true;if(keep)res(handle);else{o.remove();res(null);}};\n    o.querySelector('.vid-skip').onclick=done;\n    const v=o.querySelector('video');\n    if(!v){setTimeout(done,7000);return;}\n    v.onended=done;v.onerror=()=>{fin=true;o.remove();res(null);};\n    v.play().catch(()=>{v.muted=true;v.play().catch(()=>{const t=document.createElement('button');t.className='vid-tap';t.textContent='▶ Tap to play';o.appendChild(t);t.onclick=()=>{t.remove();v.play().catch(done);};});});\n  });\n};\n\n/* ---------- class milestone toasts (every 50 catches) ---------- */\nfunction checkClassMilestones(){\n  const seen=JSON.parse(localStorage.getItem('oly_m50')||'{}');const cnt={};S.dexCatches.forEach(c=>cnt[c.student_id]=(cnt[c.student_id]||0)+1);\n  let ch=false;Object.entries(cnt).forEach(([sid,n])=>{const m=Math.floor(n/50)*50;if(m>=50&&(seen[sid]||0)<m){seen[sid]=m;ch=true;toast(`🎊 ${studentName(sid)} has caught ${m} Pokémon! Everybody cheer!`,'🏆');confetti(120);SFX.fanfare();}});\n  if(ch)localStorage.setItem('oly_m50',JSON.stringify(seen));\n}\nconst _poll=pollCatches;pollCatches=async function(){const before=S.dexCatches.length;await _poll();if(S.dexCatches.length!==before){Object.keys(STORYC).forEach(k=>delete STORYC[k]);checkClassMilestones();}};\nloadDexCatches=async function(){ Text(sportIcon(e.ev.sport_type),74,y+36);\n    c.font='600 30px Fredoka';c.fillText(e.ev.name,134,y+24,380);c.font='22px Fredoka';c.fillStyle='#666';c.fillText(e.medal?`${ordinal(e.medal.place)} place · ${e.medal.metal_name}`:'Personal best',134,y+54,380);\n    c.textAlign='right';c.fillStyle='#111';c.font='38px Bungee';c.fillText(`${+Number(e.best).toFixed(2)}`,W-80,y+34);c.font='20px Fredoka';c.fillText(e.ev.unit_label||'',W-80,y+60);c.textAlign='left';y+=86;});\n  y=Math.max(y+24,820);\n  const boxes=[['Pokémon',b.caught.length],['Medals',b.medals.length],['Math Lv',(b.xp.math_level||START_LEVEL[studentGrade(b.s)]||6)]];\n  const bw=(W-104-24)/3;boxes.forEach(([k,v],i)=>{const x=52+i*(bw+12);rr(c,x,y,bw,90,14);c.fillStyle='rgba(0,0,0,.28)';c.fill();c.fillStyle='#fff';c.textAlign='center';c.font='40px Bungee';c.fillText(String(v),x+bw/2,y+48);c.font='20px Fredoka';c.fillText(k,x+bw/2,y+76);c.textAlign='left';});\n  y+=108;\n  if(fav){if(favImg)c.drawImage(favImg,52,y-8,80,80);c.fillStyle='#fff';c.font='20px Fredoka';c.fillText('Favorite partner',140,y+22);c.font='600 30px Fredoka';c.fillText(fav.name,140,y+56,300);}\n  c.textAlign='right';c.font='18px Fredoka';c.fillStyle='rgba(255,255,255,.85)';c.fillText('BASIS Olympics',W-60,y+56);c.textAlign='left';\n}\nasync function renderCardMaker(){\n  const v=$('#view-card');\n  v.innerHTML=`<div class=\"panel row\"><span class=\"bungee\" style=\"font-size:1.4rem;color:var(--red-deep)\">My Trainer Card<\u002Fspan>${studentPicker('cardPick')}<\u002Fdiv><div id=\"cmBody\"><\u002Fdiv>`;\n  bindPicker('cardPick',renderCardMaker);\n  if(!S.currentStudent||!S.students.find(s=>s.id===S.currentStudent)){$('#cmBody').innerHTML='<div class=\"panel empty\">👆 Pick your name to make your card!<\u002Fdiv>';return;}\n  const b=await bundleFor(S.currentStudent);let photoURL=null;\n  const sp=favSport(b),sports=[...new Set([...S.events.map(e=>e.sport_type||'Other'),...Object.keys(SPORT_TYPES)])];\n  const caught=b.caught.map(c=>S.pokeById nput type=\"file\" id=\"rcFile\" accept=\".csv,text/csv\"><button class=\"green\" id=\"rcGo\">Import<\u002Fbutton><span id=\"rcRes\"><\u002Fspan><\u002Fdiv>\n   <h3 style=\"margin-top:24px\">Students (${list.length})<\u002Fh3>${filterBar('rfBar')}\n   <div id=\"rList\">${list.map(s=>`<div class=\"list-item\">${s.photo_url?`<img src=\"${esc(s.photo_url)}\" style=\"width:48px;height:48px;border-radius:50%;object-fit:cover\">`:'<span class=\"pball\" style=\"width:40px;height:40px\"><\u002Fspan>'}\n     <b class=\"grow\">${esc(s.name)}<\u002Fb><span class=\"tag\">${studentGrade(s)}<\u002Fspan><span class=\"tag\">${esc(s.gender||'')}<\u002Fspan><span class=\"tag el\">${esc(s.class_name||'')}<\u002Fspan><span class=\"tag\">#${esc(s.student_number||'—')}<\u002Fspan><span class=\"tag\">${esc(s.dex_color||'Red')}<\u002Fspan>\n     <label class=\"btn\" style=\"min-height:36px;padding:6px 12px;font-size:.85rem\">📷 Photo<input type=\"file\" accept=\"image/*\" data-ph=\"${s.id}\" hidden><\u002Flabel><\u002Fdiv>`).join('')||'<p class=\"muted\">No students match.<\u002Fp>'}<\u002Fdiv>`;\n  bindFilterBar('rfBar',renderTeacher);\n  $('#rList').onchange=async e=>{const id=e.target.dataset.ph;if(!id||!e.target.files[0])return;try{await uploadStudentPhoto(S.students.find(s=>s.id===id),e.target.files[0]);toast('Photo saved','📷');renderTeacher();}catch(err){toast('Upload failed: '+err.message,'⚠️');}};\n  $('#rcGo').onclick=async()=>{const f=$('#rcFile').files[0];if(!f)return;const rows=parseCSV(await f.text());\n    const have=new Set(S.students.map(s=>String(s.student_number||'')).filter(Boolean));const add=[];\n    rows.forEach(r=>{if(/name/i.test(r[0])&&/grade/i.test(r[1]||''))return;const [ln,rest]=(r[0]||'').split(',').map(x=>(x||'').trim());const first=(rest||'').split(/\\s+/)[0]||ln;\n      const num=(r[3]||'').trim();if(num&&have.has(num))return;\n      add.push({name:`${first} ${ln}`.trim(),first_name:first,last_name:ln,grade:(r[1]||'').trim().toUpperCase()||null,gender:(r[2]|| =eq.${d.id}`,{[k]:val});toast('Saved','✅');};\n};\n\n/* ---------- Exports + parent reports ---------- */\nfunction dlCSV(name,rows){const csv=rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[\",\\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v;}).join(',')).join('\\n');\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();}\nasync function tReports(b){\n  const list=rosterFiltered();\n  b.innerHTML=`${filterBar('rpBar')}<p class=\"muted\">${list.length} students match. Exports and reports use these filters.<\u002Fp>\n   <h3>CSV exports<\u002Fh3><div class=\"row\"><button data-x=\"students\">Students<\u002Fbutton><button data-x=\"responses\">Responses (with time)<\u002Fbutton><button data-x=\"catches\">Catches<\u002Fbutton><button data-x=\"scores\">Events / scores<\u002Fbutton><button data-x=\"medals\">Medals<\u002Fbutton><\u002Fdiv>\n   <h3 style=\"margin-top:24px\">Parent reports<\u002Fh3><p class=\"muted\">One printable color report per student. For ParentSquare, open each student on their own and save as PDF, so each family only gets their own child's pages.<\u002Fp>\n   <div class=\"row\" style=\"margin-bottom:10px\"><button class=\"green\" id=\"rpAll\">🖨️ Generate all (${list.length})<\u002Fbutton><\u002Fdiv>\n   <div>${list.map(s=>`<div class=\"list-item\"><b class=\"grow\">${esc(s.name)}<\u002Fb><span class=\"tag el\">${esc(s.class_name||'')}<\u002Fspan><button class=\"small blue\" data-rp=\"${s.id}\">Open report<\u002Fbutton><\u002Fdiv>`).join('')}<\u002Fdiv>`;\n  bindFilterBar('rpBar',renderTeacher);\n  const ids=new Set(list.map(s=>s.id)),nm=id=>studentName(id);\n  b.onclick=async e=>{const x=e.target.dataset.x,rp=e.target.dataset.rp;\n    if(x==='students')dlCSV('students',[['name','first','last','grade','gender','student_number','element'],...list.map(s=>[s.name,s.first_name,s.last_name,studentGrade(s),s.gender,s.student_number,s.class_name])]);\n    if(x==='responses'){const r=(await selAll('oly_responses','select=*&order=created_at')).filter(r=>ids.has(r.student_id));dlCSV('responses',[['student','date','prompt','answer','correct_answer','correct','time_s','xp','encounter_id'],...r.map(r=>[nm(r.student_id),r.created_at,r.prompt,r.answer_given,r.correct_text,r.is_correct,r.time_ms?(r.time_ms/1000).toFixed(1):'',r.xp_earned,r.encounter_id])]);}\n    if(x==='catches'){const r=(await selAll('oly_student_pokemon','select=*&order=caught_date')).filter(r=>ids.has(r.student_id));dlCSV('catches',[['student','date','pokemon','ball','ball_cost','xp_after','shiny','encounter_id'],...r.map(r=>[nm(r.student_id),r.caught_date,(S.pokeById[r.pokemon_id]||{}).name,r.ball_type,r.ball_cost,r.xp_after,r.is_shiny,r.encounter_id])]);}\n    if(x==='scores'){const r=(await selAll('oly_event_scores','select=*')).filter(r=>ids.has(r.student_id));dlCSV('event_scores',[['student','event','sport','attempt','score','unit','xp'],...r.map(r=>{const ev=S.events.find(e=>e.id===r.event_id)||{};return [nm(r.student_id),ev.name,ev.sport_type,r.attempt_number,r.score,ev.unit_label,r.xp_earned];})]);}\n    if(x==='medals'){const r=(await selAll('oly_medals','select=*')).filter(r=>ids.has(r.student_id));dlCSV('medals',[['student','place','metal','event','sport'],...r.map(r=>[nm(r.student_id),r.place,r.metal_name,(S.events.find(e=>e.id===r.event_id)||{}).name||'',r.sport_type||(r.event_id?'':'Overall')])]);}\n    if(rp)openReports([rp]);\n    if(e.target.id==='rpAll')openReports(list.map(s=>s.id));\n  };\n}\nfunction lastName(s){return s.last_name||String(s.name||'').split(' ').slice(-1)[0];}\nfunction hashIdx(id,n){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return h%n;}\nfunction sparkSVG(b){\n  const ev=[...b.responses.filter(r=>r.xp_earned>0).map(r=>({t:T(r.created_at),v:r.xp_earned})),...b.scores.filter(s=>s.xp_earned&&s.created_at).map(s=>({t:T(s.created_at),v:s.xp_earned}))].sort((a,c)=>a.t-c.t);\n  if(ev.length<2)return '<p class=\"mu\">Not
