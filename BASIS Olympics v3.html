document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--green);color:#fff}button.yellow{background:var(--yellow)}\nbutton.small{min-height:34px;padding:6px 12px;font-size:.85rem;border-radius:10px}\ninput,select,textarea{font-family:'Fredoka',sans-serif;font-size:1rem;padding:10px 12px;border-radius:12px;border:3px solid #d9d2bf;background:#fff;color:var(--ink);min-height:44px}\ntextarea{min-height:90px;width:100%}\nlabel{font-weight:500}\n.hidden{display:none!important}\n\n/* Header / nav */\nheader{background:linear-gradient(var(--red),var(--red-deep));padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:6px solid #000;position:sticky;top:0;z-index:50}\n.logo{display:flex;align-items:center;gap:12px;color:#fff;font-family:'Bungee';font-size:1.5rem}\n.pball{width:42px;height:42px;border-radius:50%;background:linear-gradient(var(--red) 0 46%,#111 46% 54%,#fff 54%);border:3px solid #111;position:relative;flex:none}\n.pball::after{content:'';position:absolute;width:30%;height:30%;left:35%;top:35%;background:#fff;border:3px solid #111;border-radius:50%;box-sizing:border-box}\n.pball.great{background:linear-gradient(var(--blue) 0 46%,#111 46% 54%,#fff 54%)}\n.pball.great::before{content:'';position:absolute;left:12%;right:12%;top:14%;height:14%;background:var(--red);border-radius:6px}\nnav{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}\nnav button{font-size:1.1rem;min-height:56px;padding:10px 22px;background:var(--cream)}\nnav button.active{background:var(--yellow)}\nmain{padding:20px;max-width:1500px;margin:0 auto}\n.view{animation:fadein .25s ease}\n@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.panel{background:var(--cream);border-radius:24px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}\n.panel h2{margin:0 0 12px;color:var(--red-deep);font-size:1.4rem}\n.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}\n.grow{flex:1}\n.muted{color:var(--gray)}\n.tag{display:inline-block;background:#e6dfcc;border-radius:999px;padding:3px 10px;font-size:.8rem;margin:2px;font-weight:500}\n.tag.el{background:var(--blue);color:#fff}\n.bar{height:22px;background:#e0d9c6;border-radius:999px;overflow:hidden;border:3px solid #111}\n.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7ee08f);transition:width .6s}\n.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}\n.tabs button{min-height:48px}\n.tabs button.active{background:var(--red);color:#fff}\n.empty{padding:30px;text-align:center;color:var(--gray);font-size:1.1rem}\n.banner{background:var(--yellow);padding:14px 20px;border-radius:16px;margin-bottom:16px;font-weight:600}\n\n/* Pokedex */\n.dex{display:grid;grid-template-columns:400px 1fr;gap:0;background:var(--red);border-radius:28px;border:6px solid #111;box-shadow:0 10px 0 #000;overflow:hidden}\n.dex-left{padding:22px;border-right:8px solid var(--red-deep);background:linear-gradient(160deg,var(--red-hi),var(--red) 40%)}\n.dex-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}\n.lens{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#bfe4ff,var(--blue) 40%,var(--blue-deep));border:6px solid #fff;box-shadow:0 0 0 4px #111;animation:glow 3s ease-in-out infinite}\n.lens.flash{animation:flash .9s ease 2}\n@keyframes glow{50%{box-shadow:0 0 0 4px #111,0 0 24px 6px rgba(47,155,232,.8)}}\n@keyframes flash{0%,100%{filter:none}50%{filter:brightness(2.2);box-shadow:0 0 0 4px #111,0 0 50px 20px #fff}}\n.dots{display:flex;gap:8px;align-self:flex-start;margin-top:6px}\n.dots i{width:18px;height:18px;border-radius:50%;border:3px solid #111;display:block}\n.dex-title{color:#fff;font-family:'Bungee';font-size:1.15rem;line-height:1.2;margin:8px 0 14px;text-shadow:2px 2px 0 #000}\n.dex-screen{background:#ddd;border:6px solid #111;border-radius:12px 12px 12px 40px;padding:16px}\n.dex-screen-in{background:linear-gradient(var(--screen),var(--screen-2));border-radius:8px;height:250px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid #6e8f5c;position:relative}\n.dex-screen-in img{max-height:200px;max-width:90%;image-rendering:auto}\n.sil{filter:brightness(0)}\n.hint{font-family:'Bungee';font-size:.85rem;color:var(--ink);margin-top:4px}\n.nameplate{margin-top:14px;background:#111;color:var(--screen);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;font-family:'Bungee';font-size:1.1rem}\n.facts{margin-top:12px;background:var(--screen);border:4px solid #111;border-radius:10px;padding:12px;min-height:90px;font-size:1rem}\n.dex-right{padding:20px;background:var(--cream)}\n.seg{display:inline-flex;background:#e0d9c6;border-radius:999px;padding:4px}\n.seg button{box-shadow:none;border-radius:999px;background:transparent}\n.seg button.active{background:var(--red);color:#fff}\n.regions button{min-height:44px;font-size:.9rem;padding:8px 12px}\n.regions button small{display:block;font-size:.7rem;font-weight:500}\n.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-height:62vh;overflow:auto;padding:4px}\n.card{background:#fff;border:3px solid #d9d2bf;border-radius:16px;padding:8px;text-align:center;cursor:pointer;position:relative;min-height:140px;transition:transform .12s}\n.card:hover{transform:translateY(-3px)}\n.card.sel{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}\n.card img{width:80px;height:80px;object-fit:contain}\n.card .num{font-family:'Bungee';font-size:.75rem;color:var(--gray)}\n.card .nm{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.card .dot{position:absolute;top:8px;left:8px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #111}\n.card .cnt{position:absolute;top:6px;right:6px;background:var(--yellow);border:2px solid #111;border-radius:999px;font-family:'Bungee';font-size:.7rem;padding:1px 7px}\n.card.pop{animation:pop .7s ease}\n@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}\n\n/* Play */\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}\n.stat{background:#fff;border-radius:18px;padding:14px 18px;border:4px solid #111}\n.stat b{display:block;font-family:'Bungee';font-size:2rem;color:var(--red)}\n.stat span{font-weight:500}\n.encounter-btn{width:100%;min-height:130px;font-family:'Bungee';font-size:2.2rem;background:radial-gradient(circle at 50% 120%,var(--yellow),#f39a1e);color:#111;border:6px solid #111;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:24px;box-shadow:0 10px 0 #000}\n.encounter-btn .pball{width:70px;height:70px}\n.encounter-btn:not(:disabled) .pball{animation:bob 1.6s ease-in-out infinite}\n@keyframes bob{50%{transform:translateY(-8px) rotate(-10deg)}}\n.why{text-align:center;margin-top:10px;font-weight:600;color:var(--red-deep);font-size:1.1rem}\n.qcard{background:#fff;border:4px solid #111;border-radius:20px;padding:18px;margin-bottom:14px}\n.qtext{font-size:1.5rem;font-weight:600;margin-bottom:14px}\n.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}\n.choice{min-height:70px;font-size:1.3rem;background:var(--cream);text-align:left;border:4px solid transparent}\n.choice.picked{border-color:var(--blue);background:#dcefff}\n.qinput{font-size:1.4rem;width:100%;min-height:64px;margin-bottom:12px}\n.check{font-size:1.3rem;min-height:64px;width:100%}\n.fb{margin-top:10px;font-size:1.3rem;font-weight:600;padding:12px;border-radius:14px}\n.fb.good{background:#d3f5da;color:#16692d}.fb.bad{background:#ffdcd8;color:#9e1218}\nselect.big{font-size:1.4rem;min-height:64px;min-width:300px;font-weight:600}\n.minichart{width:100%;height:220px;background:#fff;border-radius:16px;border:4px solid #111}\n\n/* Trainer card */\n.tcard{position:relative;border-radius:28px;padding:8px;background:linear-gradient(120deg,#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c77dff,#ff6b6b);background-size:300% 300%;animation:holo 8s linear infinite}\n@keyframes holo{to{background-position:300% 0}}\n.tcard-in{border-radius:22px;padding:22px;background:var(--cream) radial-gradient(circle at 90% 10%,rgba(216,38,44,.12) 0 60px,transparent 61px),repeating-radial-gradient(circle at 0 0,transparent 0 40px,rgba(0,0,0,.025) 40px 42px)}\n.tc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}\n.tc-name{font-family:'Bungee';font-size:2.4rem;color:var(--red-deep);line-height:1}\n.tc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}\n.tc-grid div{background:#fff;border-radius:14px;padding:10px;border:3px solid #d9d2bf}\n.tc-grid b{font-family:'Bungee';font-size:1.4rem;display:block;color:var(--blue-deep)}\n.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}\n.ach{background:#fff;border:3px solid #111;border-radius:16px;padding:10px;text-align:center;cursor:pointer;min-height:110px}\n.ach .ic{font-size:2.2rem}\n.ach .an{font-size:.8rem;font-weight:600}\n.ach.locked{background:#e6e2d6;border-color:#bbb;color:#999}\n.ach.locked .ic{filter:grayscale(1) brightness(.4);opacity:.5}\n.medals{display:flex;gap:10px;flex-wrap:wrap}\n.medal{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #111;border-radius:16px;padding:8px 12px}\n.medal .disc{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bungee';font-size:1rem;border:3px solid #111;flex:none}\n.medal small{display:block;font-size:.75rem;color:var(--gray)}\n\n/* Leaderboard */\n.lb-row{display:grid;grid-template-columns:70px 1.6fr 1.3fr 1fr 1fr 1fr;gap:10px;align-items:center;background:#fff;border:4px solid #111;border-radius:18px;padding:12px 16px;margin-bottom:10px;font-size:1.15rem}\n.lb-row.head{background:transparent;border:none;font-weight:600;color:var(--gray);font-size:.95rem;padding:0 16px}\n.lb-rank{font-family:'Bun atch every Pokémon in ${r}`,trigger_type:'region_complete',trigger_value:i+1,icon_url:'🗺️',xp_reward:100}));\n  [['Hatched!',2,'🐣'],['Rookie Trainer',3,'🧢'],['Certified Trainer',4,'📜'],['Ace Status',5,'⭐'],['Gym Leader',6,'🏟️'],['Elite Four',7,'💎'],['Champion',8,'🏆'],['Pokémon Master',9,'👑']]\n    .forEach(([n,v,i])=>a.push({name:n,description:`Reach level ${v}: ${LEVELS[v-1].name}`,trigger_type:'level_up',trigger_value:v,icon_url:i,xp_reward:0}));\n  [['Hot Streak',3,'🔥'],['On Fire',5,'☄️'],['Unstoppable',10,'⚡'],['Perfect Run',20,'💯']]\n    .forEach(([n,v,i])=>a.push({name:n,description:`Answer ${v} questions correctly in a row`,trigger_type:'streak',trigger_value:v,icon_url:i,xp_reward:v*2}));\n  a.push({name:'First Event',description:'Complete an event with all 5 attempts',trigger_type:'event_complete',trigger_value:1,icon_url:'🎽',xp_reward:10});\n  a.push({name:'Event Champion',description:'Complete 5 different events',trigger_type:'event_complete',trigger_value:5,icon_url:'🥇',xp_reward:30});\n  a.push({name:'Personal Best',description:'Beat one of your own attempts in an event',trigger_type:'event_improve',trigger_value:1,icon_url:'📈',xp_reward:10});\n  a.push({name:'Consistent Performer',description:'All 5 attempts within 10% of each other',trigger_type:'event_consistent',trigger_value:1,icon_url:'🎯',xp_reward:15});\n  [100,500,1000,2500,5000].forEach(v=>a.push({name:`${v} XP`,description:`Earn ${v} total XP`,trigger_type:'xp_milestone',trigger_value:v,icon_url:'✨',xp_reward:0}));\n  a.push({name:'Legendary Encounter',description:'Meet your first Legendary Pokémon',trigger_type:'legendary_encounter',trigger_value:1,icon_url:'🌟',xp_reward:20});\n  a.push({name:'Legendary Catch',description:'Catch your first Legendary Pokémon',trigger_type:'legendary_catch',trigger_value:1,icon_url:'🐉',xp_reward:50});\n  a.push({name:'Legendary Collector',description:'Catch 3 Legendary Pokémon',trigger_type:'legendary_catch',trigger_value:3,icon_url:'🌌',xp_reward:100});\n  return a;\n})();\n\n/* ============================================================\n   STATE\n   ============================================================ */\nconst S={students:[],elements:[],settings:[],questions:[],pokemon:[],pokeById:{},achievements:[],events:[],media:[],\n  dexCatches:[],lastPoll:null,currentStudent:localStorage.getItem('oly_student')||'',view:'pokedex'};\nlet ST=null; // loaded student detail\nconst LOCAL_CATCH=new Set(); // catches made in this tab (already toasted)\n\n/* ============================================================\n   UTILS\n   ============================================================ */\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst norm=s=>String(s??'').trim().toLowerCase().replace(/\\s+/g,' ');\nconst num3=n=>'#'+String(n).padStart(3,'0');\nconst rand=a=>a[Math.floor(Math.random()*a.length)];\nconst shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst fmtDate=d=>d?new Date(d).toLocaleDateString():'';\nconst levelFor=xp=>{let l=LEVELS[0];for(const L of LEVELS)if(xp>=L.xp)l=L;return l;};\nconst levelInfo=n=>LEVELS[Math.max(0,Math.min(8,n-1))];\nconst regionOf=p=>REGIONS[(p.generation||1)-1]||'Unknown';\nconst studentName=id=>(S.students.find(s=>s.id===id)||{}).name||'Someone';\nconst studentGrade=s=>String(s.grade||gradeOf(s.class_name)).toUpperCase();\nconst firstName=s=>s.first_name||String(s.name||'').split(/[ ,]/)[0];\nconst gradeOf=el=>{el=el||'';return el[0]==='K'||el[0]==='k'?'K':(el.match(/^\\d/)||[''])[0];};\nconst sortedElements=()=>[...S.elements].sort((a,b)=>a.sort_order-b.sort_order);\nconst multiplier=()=>Number((S.settings.find(s=>s.element_name==='DEFAULT')||{}).xp_multiplier||1);\nfunction settingsFor(el){const d=S.settings.find(s=>s.element_name==='DEFAULT')||{pokeball_cost:10,greatball_cost:25,catch_rate:90};return S.settings.find(s=>s.element_name===el)||d;}\nfunction bestOf(scores,mode){if(!scores.length)return null;return mode==='lowest_wins'?Math.min(...scores):Math.max(...scores);}\nfunction fmtScore(v,unit){if(v==null)return '—';return `${+Number(v).toFixed(2)} ${unit||''}`.trim();}\nfunction rankWithTies(list,key,desc=true){ // returns [{...,place}]\n  const s=[...list].sort((a,b)=>desc?b[key]-a[key]:a[key]-b[key]);let place=0,prev=null;\n  return s.map((r,i)=>{if(prev===null||r[key]!==prev){place=i+1;prev=r[key];}return {...r,place};});\n}\n\n/* ============================================================\n   SOUND (Web Audio synth)\n   ============================================================ */\nlet AC=null;\nfunction tone(freq,dur=.15,type='sine',when=0,vol=.18){\n  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();\n    const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();\n    o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);\n    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}\n}\nconst SFX={\n  click:()=>tone(900,.05,'square',0,.08),\n  wiggle:()=>{[0,.7,1.4].forEach(w=>{tone(420,.06,'square',w,.12);tone(300,.06,'square',w+.08,.1);});},\n  chime:()=>[1047,1319,1568,2093].forEach((f,i)=>tone(f,.35,'triangle',i*.1)),\n  fanfare:()=>[[523,0],[659,.15],[784,.3],[1047,.45],[784,.65],[1047,.8]].forEach(([f,w])=>tone(f,.3,'square',w,.12)),\n  levelup:()=>[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'sawtooth',i*.09,.1)),\n  buzz:()=>{tone(160,.3,'sawtooth',0,.12);tone(120,.3,'sawtooth',.12,.1);},\n  correct:()=>{tone(784,.12,'triangle');tone(1175,.2,'triangle',.1);},\n  legend:()=>[196,247,294,392,294,392,523].forEach((f,i)=>tone(f,.4,'sawtooth',i*.18,.1)),\n};\nfunction playAudio(url){if(!url)return;try{const a=new Audio(url);a.play().catch(()=>{});}catch(e){}}\n\n/* ============================================================\n   UI HELPERS: toast, overlays, confetti\n   ============================================================ */\nfunction toast(msg,icon='⚪'){\n  const t=document.createElement('div');t.className='toast';t.innerHTML=`<span style=\"font-size:1.6rem\">${icon}<\u002Fspan><span>${esc(msg)}<\u002Fspan>`;\n  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),4500);\n}\nfunction openOverlay(html,{onClose,cls=''}={}){\n  const o=document.createElement('div');o.className='overlay '+cls;o.innerHTML=html;$('#overlay-root').appendChild(o);\n  o.close=()=>{o.remove();onClose&&onClose();};return o;\n}\nfunction confetti(n=90){\n  if(reducedMotion())return;\n  const b=document.createElement('div');b.className='burst';\n  const cols=['#d8262c','#f6c935','#3fbf5f','#2f9be8','#fff','#c77dff'];\n  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=rand(cols);\n    p.style.animationDuration=(1.6+Math.random()*1.8)+'s';p.style.animationDelay=Math.random()*.6+'s';p.style.borderRadius=Math.random()<.5?'50%':'2px';b.appendChild(p);}\n  document.body.appendChild(b);setTimeout(()=>b.remove(),4200);\n}\nfunction screenFlash(){const f=document.createElement('div');f.className='screenflash';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);}\nfunction confirmBox(msg){return new Promise(res=>{const o=openOverlay(`<div class=\"modal\" style=\"max-width:480px\"><h2>Are you sure?<\u002Fh2><p style=\"font-size:1.1rem;text-align:center\">${esc(msg)}<\u002Fp><div class=\"row\" style=\"justify-content:center\"><button data-a=\"no\">Cancel<\u002Fbutton><button class=\"red\" data-a=\"yes\">Yes<\u002Fbutton><\u002Fdiv><\u002Fdiv>`);\n  o.onclick=e=>{const a=e.target.dataset.a;if(a){o.remove();res(a==='yes');}};});}\n\n/* Celebration queue — achievements, level ups, goals shown one at a time */\nconst celebQ=[];let celebBusy=false;\nfunction celebrate(item){celebQ.push(item);if(!celebBusy)nextCeleb();}\nfunction nextCeleb(){\n  const it=celebQ.shift();if(!it){celebBusy=false;return;}celebBusy=true;\n  let html;\n  if(it.kind==='level'){SFX.levelup();html=`<div class=\"ach-pop\"><div class=\"levelup\">LEVEL UP!<\u002Fdiv><div class=\"ic\">⬆️<\u002Fdiv><h2>${esc(it.name)}<\u002Fh2><p style=\"font-size:1.3rem\">${esc(it.student)} is now Level ${it.level}: <b>${esc(LEVELS[it.level-1].name)}<\u002Fb>!<\u002Fp>${LEG_LEVELS.includes(it.level)?'<p style=\"font-size:1.2rem;color:#9e1218;font-weight:600\">🌟 A LEGENDARY Pokémon awaits on your next encounter!<\u002Fp>':''}<\u002Fdiv>`;}\n  else {SFX.fanfare();html=`<div class=\"ach-pop\"><div class=\"bungee\" style=\"color:#9e1218\">${it.kind==='goal'?'Goal Complete!':'Achievement Unlocked!'}<\u002Fdiv><div class=\"ic\">${esc(it.icon||'🏆')}<\u002Fdiv><h2>${esc(it.name)}<\u002Fh2><p style=\"font-size:1.2rem\">${esc(it.description||'')}<\u002Fp>${it.xp?`<p class=\"bungee\" style=\"color:#3fbf5f\">+${it.xp} XP<\u002Fp>`:''}<p class=\"muted\">${esc(it.student||'')}<\u002Fp><\u002Fdiv>`;}\n  confetti();\n  const o=openOverlay(html);\n  let done=false;const fin=()=>{if(done)return;done=true;o.remove();setTimeout(nextCeleb,250);};\n  o.onclick=fin;setTimeout(fin,4000);\n}\n\n/* ============================================================\n   CHART (canvas line chart)\n   ============================================================ */\nfunction drawChart(canvas,series,{normalize=false}={}){\n  const dpr=window.devicePixelRatio||1,W=canvas.clientWidth,H=canvas.clientHeight;\n  canvas.width=W*dpr;canvas.height=H*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);\n  const pad={l:48,r:16,t:16,b:34};\n  const all=series.flatMap(s=>s.points);\n  c.font='13px Fredoka';c.fillStyle='#8a8578';\n  if(!all.length){c.fillText('No data yet — keep playing!',W/2-80,H/2);return;}\n  const tmin=Math.min(...all.map(p=>p[0])),tmax=Math.max(...all.map(p=>p[0]))||tmin+1;\n  const span=Math.max(tmax-tmin,86400000);\n  const gmax=Math.max(1,...all.map(p=>p[1]));\n  const X=t=>pad.l+(t-tmin)/span*(W-pad.l-pad.r);\n  c.strokeStyle='#eee';c.lineWidth=1;\n  for(let i=0;i<=4;i++){const y=pad.t+i*(H-pad.t-pad.b)/4;c.beginPath();c.moveTo(pad.l,y);c.lineTo(W-pad.r,y);c.stroke();\n    if(!normalize)c.fillText(Math.round(gmax*(1-i/4)),4,y+4);else c.fillText(Math.round(100*(1-i/4))+'%',4,y+4);}\n  c.fillText(new Date(tmin).toLocaleDateString(),pad.l,H-10);c.fillText(new Date(tmin+span).toLocaleDateString(),W-pad.r-80,H-10);\n  series.forEach(s=>{\n    if(!s.points.length)return;const max=normalize?Math.max(1,...s.points.map(p=>p[1])):gmax;\n    const Y=v=>pad.t+(1-v/max)*(H-pad.t-pad.b);\n    c.strokeStyle=s.color;c.lineWidth=4;c.lineJoin='round';c.beginPath();\n    s.points.forEach((p,i)=>{i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]));});c.stroke();\n    c.fillStyle=s.color;s.points.forEach(p=>{c.beginPath();c.arc(X(p[0]),Y(p[1]),4,0,7);c.fill();});\n  });\n}\nfunction cumulative(events){ // events [{t,v}] -> points [[t,sum]]\n  const s=[...events].sort((a,b)=>a.t-b.t);let sum=0;return s.map(e=>[e.t,sum+=e.v]);\n}\n\n/* ============================================================\n   DATA LOADING\n   ============================================================ */\nasync function loadCore(){\n  const [students,elements,settings,questions,achievements,events,media]=await Promise.all([\n    sel('oly_students','select=*&order=first_name,name'),sel('oly_elements','select=*&order=sort_order'),sel('oly_settings','select=*'),\n    sel('oly_questions','select=*&order=created_at.desc'),sel('oly_achievements','select=*&order=created_at'),\n    sel('oly_events','select=*&order=created_at'),sel('oly_media','select=*')]);\n  Object.assign(S,{students,elements,settings,questions,achievements,events,media});\n  if(!S.settings.find(s=>s.element_name==='DEFAULT')){const r=await ins('oly_settings',[{element_name:'DEFAULT'}],{onConflict:'element_name',ignore:true});S.settings.push(...(r||[]));}\n}\nasync function loadPokemon(){\n  S.pokemon=await selAll('pokemon','select=id,pokedex_id,name,generation,image_url,is_legendary,audio_url,card_image_small,card_image_large&order=pokedex_id');\n  S.pokeById={};S.pokemon.forEach(p=>S.pokeById[p.id]=p);\n}\nasync function seedAchievements(){\n  if(S.achievements.length)return;\n  S.achievements=await ins('oly_achievements',ACH_SEED);\n}\nasync function loadDexCatches(){\n  S.dexCatches=await selAll('oly_student_pokemon','select=student_id,pokemon_id,caught_date,ball_type&order=caught_date');\n  S.lastPoll=S.dexCatches.length?S.dexCatches[S.dexCatches.length-1].caught_date:new Date().toISOString();\n  S.escaped={};(await selAll('oly_throws','select=student_id,pokemon_id&caught=eq.false')).forEach(t=>(S.escaped[t.student_id]=S.escaped[t.student_id]||new Set()).add(t.pokemon_id));\n}\n\nasync function ensureXP(sid){\n  let r=await sel('oly_student_xp',`student_id=eq.${sid}&select=*`);\n  if(!r.length)r=await ins('oly_student_xp',[{student_id:sid}],{onConflict:'student_id',upsert:true});\n  return r[0];\n}\nasync function loadStudent(sid){\n  if(!sid){ST=null;return null;}\n  const s=S.students.find(x=>x.id===sid);if(!s){ST=null;return null;}\n  const [xp,caught,throws,responses,achs,scores,medals,assign,sgoals]=await Promise.all([\n    ensureXP(sid),sel('oly_student_pokemon',`student_id=eq.${sid}&select=*&order=caught_date`),\n    sel('oly_throws',`student_id=eq.${sid}&select=*&order=created_at`),\n    sel('oly_responses',`student_id=eq.${sid}&select=*&order=created_at`),\n    sel('oly_student_achievements',`student_id=eq.${sid}&select=*`),\n    sel('oly_event_scores',`student_id=eq.${sid}&select=*`),\n    sel('oly_medals',`student_id=eq.${sid}&select=*&order=place`),\n    sel('oly_assignments',`student_id=eq.${sid}&select=*`),\n    sel('oly_student_goals',`student_id=eq.${sid}&select=*`)]);\n  ST={s,xp,caught,throws,responses,achs,scores,medals,assign,sgoals};\n  return ST;\n}\nfunction wallet(st=ST){return (st.xp.total_xp||0)-(st.xp.xp_spent||0);}\nfunction studentStats(st=ST){\n  const caughtIds=new Set(st.caught.map(c=>c.pokemon_id));\n  const correct=st.responses.filter(r=>r.is_correct).length;\n  const evDone={};st.scores.forEach(sc=>{(evDone[sc.event_id]=evDone[sc.event_id]||[]).push(sc);});\n  const completed=Object.entries(evDone).filter(([eid,arr])=>{const ev=S.events.find(e=>e.id===eid);return arr.length>=Math.min(5,(ev&&ev.max_attempts_per_student)||5);}).length;\n  const legCaught=st.caught.filter(c=>(S.pokeById[c.pokemon_id]||{}).is_legendary).length;\n  const legSeen=new Set(st.throws.filter(t=>(S.pokeById[t.pokemon_id]||{}).is_legendary).map(t=>t.pokemon_id)).size;\n  return {caughtIds,caught:st.caught.length,throws:st.throws.length,correct,attempted:st.responses.length,\n    completed,legCaught,legSeen,evDone,streak:st.xp.current_streak||0,best:st.xp.best_streak||0,xp:st.xp.total_xp||0,level:st.xp.level||1};\n}\n\n/* ============================================================\n   XP / LEVEL / ACHIEVEMENTS / GOALS\n   ============================================================ */\nasync function saveXP(patch){\n  Object.assign(ST.xp,patch,{last_updated:new Date().toISOString()});\n  await upd('oly_student_xp',`student_id=eq.${ST.s.id}`,{...patch,last_updated:ST.xp.last_updated});\n}\nasync function awardXP(base){\n  const gained=Math.round(base*multiplier());\n  const total=(ST.xp.total_xp||0)+gained;\n  const newLvl=Math.max(ST.xp.level||1,levelFor(total).n);\n  const patch={total_xp:total};\n  if(newLvl>(ST.xp.level||1)){\n    patch.level=newLvl;\n    for(let l=(ST.xp.level||1)+1;l<=newLvl;l++){\n      celebrate({kind:'level',level:l,student:ST.s.name,name:'Level '+l});\n      if(LEG_LEVELS.includes(l))patch.legendary_pending=true;\n    }\n  }\n  await saveXP(patch);\n  return gained;\n}\nasync function updateStreak(correct){\n  const cur=correct?(ST.xp.current_streak||0)+1:0;\n  await saveXP({current_streak:cur,best_streak:Math.max(ST.xp.best_streak||0,cur)});\n}\nfunction achievementMet(a,st,stats){\n  const v=a.trigger_value;\n  switch(a.trigger_type){\n    case 'catch_count':return stats.caught>=v;\n    case 'level_up':return stats.level>=v;\n    case 'streak':return stats.best>=v;\n    case 'xp_milestone':return stats.xp>=v;\n    case 'event_complete':return stats.completed>=v;\n    case 'legendary_catch':return stats.legCaught>=v;\n    case 'legendary_encounter':return stats.legSeen>=v||stats.legCaught>=v;\n    case 'region_complete':{const reg=S.pokemon.filter(p=>p.generation===v);return reg.length>0&&reg.every(p=>stats.caughtIds.has(p.id));}\n    case 'event_improve':return Object.values(stats.evDone).some(arr=>{const ev=S.events.find(e=>e.id===arr[0].event_id);const lo=ev&&ev.scoring_mode==='lowest_wins';\n      const s=[...arr].sort((a,b)=>a.attempt_number-b.attempt_number).map(x=>+x.score);return s.some((x,i)=>i>0&&(lo?x<Math.min(...s.slice(0,i)):x>Math.max(...s.slice(0,i))));});\n    case 'event_consistent':return Object.values(stats.evDone).some(arr=>{if(arr.length<5)return false;const s=arr.map(x=>+x.score),mx=Math.max(...s),mn=Math.min(...s);return mx>0&&(mx-mn)<=mx*.1;});\n  }\n  return false;\n}\nasync function checkAchievements(){\n  if(!ST)return;\n  for(let guard=0;guard<5;guard++){\n    const have=new Set(ST.achs.map(a=>a.achievement_id));const stats=studentStats();\n    const fresh=S.achievements.filter(a=>!have.has(a.id)&&achievementMet(a,ST,stats));\n    if(!fresh.length)break;\n    const rows=await ins('oly_student_achievements',fresh.map(a=>({student_id:ST.s.id,achievement_id:a.id})),{onConflict:'student_id,achievement_id',ignore:true});\n    ST.achs.push(...(rows||[]));\n    for(const a of fresh){\n      let xp=0;if(a.xp_reward)xp=await awardXP(a.xp_reward);\n      celebrate({kind:'ach',name:a.name,icon:a.icon_url,description:a.description,xp,student:ST.s.name});\n    }\n  }\n  await syncGoals(true);\n}\nfunction goalsForStudent(s,goals){\n  return goals.filter(g=>(g.scope==='individual'&&g.scope_value===s.id)||(g.scope==='element'&&g.scope_value===s.class_name)||(g.scope==='grade'&&g.scope_value===studentGrade(s)));\n}\nfunction goalValue(type,stats){return {xp:stats.xp,catch:stats.caught,event:stats.completed,level:stats.level,streak:stats.best}[type]??0;}\nasync function syncGoals(announce){\n  if(!ST)return;\n  const goals=await sel('oly_goals','select=*');const mine=goalsForStudent(ST.s,goals);if(!mine.length)return;\n  const stats=studentStats();const rows=[];\n  for(const g of mine){\n    const cur=goalValue(g.goal_type,stats),done=cur>=Number(g.target_value);\n    const prev=ST.sgoals.find(x=>x.goal_id===g.id);\n    const row={student_id:ST.s.id,goal_id:g.id,current_value:cur,completed:done,completed_date:done?(prev&&prev.completed_date)||new Date().toISOString():null};\n    rows.push(row);\n    if(done&&!(prev&&prev.completed)&&announce)celebrate({kind:'goal',name:g.title,icon:'🎯',description:'You reached your goal!',student:ST.s.name});\n  }\n  ST.sgoals=await ins('oly_student_goals',rows,{onConflict:'student_id,goal_id',upsert:true})||ST.sgoals;\n}\n\n/* ============================================================\n   NAVIGATION\n   ============================================================ */\n$('#nav').onclick=e=>{const v=e.target.closest('button')?.dataset.view;if(v)showView(v);};\nasync function showView(v){\n  S.view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));\n  document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));\n  const el=$('#view-'+v);el.classList.remove('hidden');el.classList.remove('view');void el.offsetWidth;el.classList.add('view');\n  try{\n    if(v==='pokedex'){\n      if(S.currentStudent&&S.students.find(x=>x.id===S.currentStudent)){\n        DEX.mode='my';DEX.student=S.currentStudent;DEX.filter='caught';DEX.search='';\n        const mine=S.dexCatches.filter(c=>c.student_id===S.currentStudent);\n        if(mine.length){DEX.selected=mine[mine.length-1].pokemon_id;DEX.region=0;}\n      }\n      renderDex();\n      const sel=document.querySelector('#dexGrid .card.sel');if(sel)sel.scrollIntoView({block:'center'});\n    }\n    if(v==='play')await renderPlay();\n    if(v==='events')await renderStudentEvents();\n    if(v==='leader')await renderLeaderboard();\n    if(v==='teacher')await renderTeacher();\n  }catch(err){console.error(err);el.innerHTML=`<div class=\"panel\"><h2>Oops<\u002Fh2><p>${esc(err.message)}<\u002Fp><\u002Fdiv>`;}\n}\nfunction studentPicker(id){\n  const st=S.students.find(x=>x.id===S.currentStudent);\n  return `<button class=\"big-pick\" id=\"${id}\">${st?`👤 ${esc(st.name)} <small>${esc(st.class_name||'')} · tap to change<\u002Fsmall>`:'👤 Tap to find your name'}<\u002Fbutton>`;\n}\nfunction bindPicker(id,cb){$('#'+id).onclick=()=>pickStudentFlow(sid=>{S.currentStudent=sid;localStorage.setItem('oly_student',sid);cb();});}\nfunction pickStudentFlow(done){\n  const P={grade:null,el:null,letter:null};\n  const o=openOverlay(`<div class=\"modal pick-modal\"><div class=\"pick-head\"><button class=\"small\" data-back>◀ Back<\u002Fbutton><h2 id=\"pkTitle\"><\u002Fh2><button class=\"small\" data-x>✕<\u002Fbutton><\u002Fdiv><div id=\"pkCrumb\" class=\"pick-crumb\"><\u002Fdiv><div id=\"pkBody\" class=\"pick-grid\"><\u002Fdiv><\u002Fdiv>`);\n  const gOrder=g=>g==='K'?0:+g||9;\n  const pool=()=>S.students.filter(x=>(!P.grade||studentGrade(x)===P.grade)&&(!P.el||(x.class_name||'—')===P.el)&&(!P.letter||firstName(x)[0].toUpperCase()===P.letter));\n  function render(){\n    let title,items;\n    if(!P.grade){title='What grade are you in?';items=[...new Set(S.students.map(studentGrade))].sort((a,b)=>gOrder(a)-gOrder(b)).map(g=>({k:g,label:g==='K'?'Kinder':'Grade '+g,big:g}));}\n    else if(!P.el){title='Pick your class';const els=[...new Set(pool().map(x=>x.class_name||'—'))];const ord=sortedElements().map(e=>e.name);els.sort((a,b)=>(ord.indexOf(a)+99)%999-(ord.indexOf(b)+99)%999);items=els.map(e=>({k:e,big:e}));}\n    else if(!P.letter){title='First letter of your first name';items=[...new Set(pool().map(x=>firstName(x)[0].toUpperCase()))].sort().map(l=>({k:l,big:l}));}\n    else {title='Tap your name';items=pool().sort((a,b)=>firstName(a).localeCompare(firstName(b))).map(x=>({k:x.id,label:x.last_name||'',big:firstName(x),photo:x.photo_url}));}\n    $('#pkTitle').textContent=title;\n    $('#pkCrumb').innerHTML=[P.grade&&(P.grade==='K'?'Kinder':'Grade '+P.grade),P.el,P.letter].filter(Boolean).map(x=>`<span class=\"tag el\">${esc(x)}<\u002Fspan>`).join(' ');\n    o.querySelector('[data-back]').style.visibility=P.grade?'visible':'hidden';\n    $('#pkBody').className='pick-grid'+(P.letter?' names':'');\n    $('#pkBody').innerHTML=items.map(i=>`<button class=\"pick-tile\" data-k=\"${esc(i.k)}\">${i.photo?`<img src=\"${esc(i.photo)}\" alt=\"\">`:''}<b>${esc(i.big)}<\u002Fb>${i.label?`<small>${esc(i.label)}<\u002Fsmall>`:''}<\u002Fbutton>`).join('')||'<div class=\"empty\">Nobody here yet<\u002Fdiv>';\n    if(items.length===1&&!P.letter&&P.grade){/* auto-advance single choices */}\n  }\n  o.onclick=e=>{\n    if(e.target.closest('[data-x]')){o.remove();return;}\n    if(e.target.closest('[data-back]')){if(P.letter)P.letter=null;else if(P.el)P.el=null;else P.grade=null;render();return;}\n    const t=e.target.closest('.pick-tile');if(!t)return;SFX.click();const k=t.dataset.k;\n    if(!P.grade)P.grade=k;else if(!P.el)P.el=k;else if(!P.letter)P.letter=k;else{o.remove();done(k);return;}\n    render();\n  };\n  render();\n}\n\n/* ============================================================\n   POKÉDEX\n   ============================================================ */\nconst DEX={mode:'class',filter:'all',region:0,search:'',student:'',selected:null,newIds:new Set()};\nfunction dexData(){\n  const counts={},firstBy={};\n  let mine=null;\n  if(DEX.mode==='my'&&DEX.student){mine={};S.dexCatches.filter(c=>c.student_id===DEX.student).forEach(c=>mine[c.pokemon_id]=c);}\n  S.dexCatches.forEach(c=>{counts[c.pokemon_id]=(counts[c.pokemon_id]||0)+1;(firstBy[c.pokemon_id]=firstBy[c.pokemon_id]||[]).push(c);});\n  const isCaught=p=>DEX.mode==='my'?!!(mine&&mine[p.id]):!!counts[p.id];\n  const esc_=DEX.mode==='my'&&DEX.student&&S.escaped?S.escaped[DEX.student]:null;\n  const isAway=p=>!!(esc_&&esc_.has(p.id)&&!isCaught(p));\n  return {counts,firstBy,mine,isCaught,isAway};\n}\nfunction renderDex(){\n  const v=$('#view-pokedex');\n  if(!S.pokemon.length){v.innerHTML='<div class=\"panel empty\">Loading Pokédex…<\u002Fdiv>';return;}\n  v.innerHTML=`<div class=\"dex2\">\n    <div class=\"dx-left\">\n      <i class=\"screw tl\"><\u002Fi><i class=\"screw tr\"><\u002Fi>\n      <div class=\"dx-top\"><div class=\"dx-lens\" id=\"lens\"><div><\u002Fdiv><\u002Fdiv><div class=\"dx-leds\"><i class=\"r\"><\u002Fi><i class=\"y\"><\u002Fi><i class=\"g\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"dx-title\">BASIS Olympics Pokédex<\u002Fdiv>\n      <div class=\"dx-bezel\"><div class=\"dx-screen\" id=\"dexScreen\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"dx-plate\"><span id=\"dexName\">???<\u002Fspan><span id=\"dexNum\"><\u002Fspan><\u002Fdiv>\n      <div class=\"dx-holder\"><i class=\"screw tl\"><\u002Fi><i class=\"screw tr\"><\u002Fi><i class=\"screw bl\"><\u002Fi><i class=\"screw br\"><\u002Fi>\n        <div class=\"dx-slider l\"><i><\u002Fi><\u002Fdiv><div class=\"dx-slider r\"><i><\u002Fi><\u002Fdiv>\n        <div class=\"dx-card\" id=\"dexCard\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"dx-facts\" id=\"dexFacts\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dx-right\"><i class=\"screw tr\"><\u002Fi>\n      <div class=\"row\" style=\"margin-bottom:14px\">\n        <div class=\"dx-seg\" id=\"dexMode\"><button data-m=\"class\">Class Pokédex<\u002Fbutton><button data-m=\"my\">My Pokédex<\u002Fbutton><\u002Fdiv>\n        <span id=\"dexStudentWrap\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"row\" style=\"margin-bottom:14px\">\n        <div class=\"dx-seg\" id=\"dexFilter\"><button data-f=\"all\">All<\u002Fbutton><button data-f=\"caught\">Caught<\u002Fbutton><button data-f=\"not\">Not Yet<\u002Fbutton><button data-f=\"away\" id=\"fAway\">Got Away<\u002Fbutton><\u002Fdiv>\n        <input id=\"dexSearch\" class=\"dx-search grow\" placeholder=\"🔍  Search by name…\" value=\"${esc(DEX.search)}\">\n      <\u002Fdiv>\n      <div class=\"dx-regions\" id=\"dexRegions\"><\u002Fdiv>\n      <div class=\"dx-prog\"><b id=\"dexProgText\"><\u002Fb><div class=\"dx-bar\"><i id=\"dexProg\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n      <div class=\"dx-gridwrap\"><div class=\"dx-grid\" id=\"dexGrid\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>`;\n  $('#dexMode').onclick=e=>{const m=e.target.dataset.m;if(m){DEX.mode=m;if(m==='my'&&!DEX.student)DEX.student=S.currentStudent;renderDexBody();}};\n  $('#dexFilter').onclick=e=>{const f=e.target.dataset.f;if(f){DEX.filter=f;renderDexBody();}};\n  $('#dexSearch').oninput=e=>{DEX.search=e.target.value;renderDexGrid();};\n  $('#dexRegions').onclick=e=>{const b=e.target.closest('button');if(b){DEX.region=+b.dataset.r;renderDexBody();}};\n  $('#dexGrid').onclick=e=>{const c=e.target.closest('.card');if(c)selectDex(+c.dataset.id,true);};\n  renderDexBody();\n}\nfunction renderDexBody(){\n  document.querySelectorAll('#dexMode button').forEach(b=>b.classList.toggle('active',b.dataset.m===DEX.mode));\n  if(DEX.mode!=='my'&&DEX.filter==='away')DEX.filter='all';\n  $('#fAway').classList.toggle('hidden',DEX.mode!=='my');\n  document.querySelectorAll('#dexFilter button').forEach(b=>b.classList.toggle('active',b.dataset.f===DEX.filter));\n  $('#dexStudentWrap').innerHTML=DEX.mode==='my'?`<select id=\"dexStudent\"><option value=\"\">Pick a student…<\u002Foption>${S.students.map(s=>`<option value=\"${s.id}\" ${s.id===DEX.student?'selected':''}>${esc(s.name)} ${s.class_name?'('+esc(s.class_name)+')':''}<\u002Foption>`).join('')}<\u002Fselect>`:'';\n  if(DEX.mode==='my')$('#dexStudent').onchange=e=>{DEX.student=e.target.value;renderDexBody();};\n  const {isCaught}=dexData();\n  $('#dexRegions').innerHTML=['All',...REGIONS].map((r,i)=>{const list=i?S.pokemon.filter(p=>p.generation===i):S.pokemon;const c=list.filter(isCaught).length;\n    return `<button data-r=\"${i}\" class=\"${DEX.region===i?'active':''}\">${r}<small>${c}/${list.length}<\u002Fsmall><\u002Fbutton>`;}).join('');\n  renderDexGrid();\n  if(DEX.selected)selectDex(DEX.selected,false);else renderDexScreen(null);\n}\nfunction renderDexGrid(){\n  const {counts,isCaught,isAway}=dexData();\n  let list=DEX.region?S.pokemon.filter(p=>p.generation===DEX.region):S.pokemon;\n  const total=list.length,caughtN=list.filter(isCaught).length;\n  $('#dexProgText').textContent=`Caught ${caughtN} of ${total}`;$('#dexProg').style.width=(total?caughtN/total*100:0)+'%';\n  if(DEX.filter==='caught')list=list.filter(isCaught);if(DEX.filter==='not')list=list.filter(p=>!isCaught(p)&&!isAway(p));if(DEX.filter==='away')list=list.filter(isAway);\n  const q=norm(DEX.search);\n  if(q)list=list.filter(p=>isCaught(p)&&norm(p.name).includes(q)||String(p.pokedex_id)===q);\n  $('#dexGrid').innerHTML=list.length?list.map(p=>{const c=isCaught(p);\n    return `<div class=\"card dx-tile ${DEX.selected===p.id?'sel':''} ${DEX.newIds.has(p.id)?'pop':''}\" data-id=\"${p.id}\">\n      ${c?'<span class=\"dot\"><\u002Fspan>':''}${isAway(p)?'<span class=\"xmark\">✕<\u002Fspan>':''}${DEX.mode==='class'&&counts[p.id]?`<span class=\"cnt\">×${counts[p.id]}<\u002Fspan>`:''}\n      <img loading=\"lazy\" src=\"${esc(p.image_url)}\" class=\"${c?'':'sil'}\" alt=\"\">\n      <div class=\"num\">${num3(p.pokedex_id)}<\u002Fdiv><div class=\"nm\">${c?esc(p.name):'???'}<\u002Fdiv><\u002Fdiv>`;}).join(''):'<div class=\"empty\">No Pokémon here yet!<\u002Fdiv>';\n  DEX.newIds.clear();\n}\nfunction selectDex(id,user){\n  DEX.selected=id;document.querySelectorAll('#dexGrid .card').forEach(c=>c.classList.toggle('sel',+c.dataset.id===id));\n  renderDexScreen(S.pokeById[id],user);\n}\nfunction renderDexScreen(p,user){\n  const scr=$('#dexScreen');if(!scr)return;\n  if(!p){scr.innerHTML='<div class=\"hint\">Tap a Pokémon!<\u002Fdiv>';$('#dexName').textContent='???';$('#dexNum').textContent='';$('#dexCard').innerHTML='<div class=\"dx-cardback\"><\u002Fdiv>';$('#dexFacts').textContent='';return;}\n  const {firstBy,mine,isCaught}=dexData();const c=isCaught(p);\n  scr.innerHTML=`<img src=\"${esc(p.image_url)}\" class=\"${c?'reveal':'sil'}\" alt=\"\">${c?'':'<div class=\"hint\">Who\\'s that Pokémon?<\u002Fdiv>'}`;\n  $('#dexName').textContent=c?p.name:'???';$('#dexNum').textContent=num3(p.pokedex_id);\n  const card=p.card_image_small||p.card_image_large;\n  $('#dexCard').innerHTML=card?`<img src=\"${esc(card)}\" class=\"${c?'':'sil card-sil'}\" alt=\"\" ${c?`data-large=\"${esc(p.card_image_large||card)}\"`:''}>`:'<div class=\"dx-cardback\"><\u002Fdiv>';\n  let facts=`${regionOf(p)}${p.is_legendary&&c?' · 🌟 Legendary':''}`;\n  if(DEX.mode==='class'){const by=firstBy[p.id]||[];facts+=by.length?` · Caught by ${by.map(x=>esc(studentName(x.student_id))).join(', ')}`:' · Nobody has caught this one yet!';}\n  else if(mine&&mine[p.id]){facts+=` · Caught ${fmtDate(mine[p.id].caught_date)}`;if(user)playAudio(p.audio_url);}\n  else facts+=' · Not caught yet';\n  $('#dexFacts').innerHTML=facts;\n  const im=$('#dexCard img[data-large]');if(im)im.onclick=()=>{const o=openOverlay(`<img src=\"${esc(im.dataset.large)}\" class=\"reveal\" style=\"max-height:92vh;max-width:92vw;border-radius:18px;box-shadow:0 0 60px rgba(255,255,255,.4)\">`);o.onclick=()=>o.remove();};\n}\nasync function pollCatches(){\n  try{\n    const rows=await sel('oly_student_pokemon',`select=student_id,pokemon_id,caught_date,ball_type&caught_date=gt.${encodeURIComponent(S.lastPoll)}&order=caught_date`);\n    if(rows.length){\n      S.dexCatches.push(...rows);S.lastPoll=rows[rows.length-1].caught_date;\n      rows.forEach(r=>{const p=S.pokeById[r.pokemon_id];if(!LOCAL_CATCH.delete(r.student_id+'|'+r.pokemon_id))toast(`${studentName(r.student_id)} caught ${p?p.name:'a Pokémon'}!`,'🎉');DEX.newIds.add(r.pokemon_id);});\n      if(S.view==='pokedex'&&$('#dexGrid')){renderDexBody();const l=$('#lens');if(l){l.classList.remove('flash');void l.offsetWidth;l.classList.add('flash');}}\n    }\n  }catch(e){console.warn('poll',e);}\n}\n\n/* ============================================================\n   PLAY\n   ============================================================ */\nfunction encounterPool(legendary){\n  const seen=new Set([...ST.caught.map(c=>c.pokemon_id),...ST.throws.map(t=>t.pokemon_id)]);\n  return S.pokemon.filter(p=>!!p.is_legendary===legendary&&!seen.has(p.id));\n}\nasync function renderPlay(){\n  const v=$('#view-play');\n  v.innerHTML=`<div class=\"panel row\"><span class=\"bungee\" style=\"font-size:1.4rem;color:var(--red-deep)\">Who's playing?<\u002Fspan>${studentPicker('playPick')}<\u002Fdiv><div id=\"playBody\"><\u002Fdiv>`;\n  bindPicker('playPick',renderPlay);\n  if(!S.currentStudent||!S.students.find(s=>s.id===S.currentStudent)){$('#playBody').innerHTML='<div class=\"panel empty\">👆 Pick your name to start playing!<\u002Fdiv>';return;}\n  $('#playBody').innerHTML='<div class=\"panel empty\">Loading…<\u002Fdiv>';\n  await loadStudent(S.currentStudent);await syncGoals(false);\n  renderPlayBody();\n}\nfunction renderPlayBody(){\n  const st=ST,stats=studentStats(),lv=levelInfo(stats.level),next=LEVELS[stats.level];\n  const set=settingsFor(st.s.class_name),w=wallet();\n  const pct=next?Math.min(100,(stats.xp-lv.xp)/(next.xp-lv.xp)*100):100;\n  const pool=encounterPool(false),legPool=encounterPool(true);\n  const legReady=st.xp.legendary_pending&&legPool.length;\n  let why='';\n  if(w<Math.min(set.pokeball_cost,set.greatball_cost))why=`You need ${set.pokeball_cost} XP for a Poké Ball. Answer questions to earn more XP!`;\n  else if(!pool.length&&!legReady)why='Wow! You have met every Pokémon! Ask your teacher to reset encounters.';\n  const pending=pendingQuestions();\n  $('#playBody').innerHTML=`\n  <div class=\"panel\">\n    <div class=\"stats\">\n      <div class=\"stat\"><span>⭐ Total XP<\u002Fspan><b>${stats.xp}<\u002Fb><\u002Fdiv>\n      <div class=\"stat\"><span>🏅 Level ${lv.n}<\u002Fspan><b style=\"font-size:1.4rem\">${esc(lv.name)} — Level ${lv.n}<\u002Fb><div class=\"bar\" style=\"margin-top:6px\"><i style=\"width:${pct}%\"><\u002Fi><\u002Fdiv><small>${next?`${next.xp-stats.xp} XP to ${next.name}`:'Max level!'}<\u002Fsmall><\u002Fdiv>\n      <div class=\"stat\"><span>⚪ XP to spend on Poké Balls<\u002Fspan><b>${w}<\u002Fb><small>Poké Ball ${set.pokeball_cost} · Great Ball ${set.greatball_cost}<\u002Fsmall><\u002Fdiv>\n      <div class=\"stat\"><span>🎒 Pokémon caught<\u002Fspan><b>${stats.caught}<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"panel\" style=\"background:transparent;box-shadow:none;padding:0\">\n    <button class=\"encounter-btn\" id=\"encBtn\" ${why?'disabled':''}><div class=\"pball\"><\u002Fdiv>${legReady?'🌟 Legendary Encounter!':'Wild Pokémon Encounter!'}<div class=\"pball great\"><\u002Fdiv><\u002Fbutton>\n    ${why?`<div class=\"why\">${esc(why)}<\u002Fdiv>`:''}\n  <\u002Fdiv>\n  <div class=\"panel\" id=\"goalsPanel\"><\u002Fdiv>\n  <div class=\"panel\"><h2>🧮 Math Practice <span class=\"tag\" style=\"font-size:1rem\">Level ${mathLevel()}: ${esc(MATH_LEVELS[mathLevel()].name)}<\u002Fspan><\u002Fh2><div id=\"mathBox\"><\u002Fdiv><\u002Fdiv>\n  <div class=\"panel ${pending.length?'':'hidden'}\"><h2>📝 Your Questions<\u002Fh2><div id=\"qList\">${pending.length?'':'<div class=\"empty\">🎉 All done! No questions waiting right now.<\u002Fdiv>'}<\u002Fdiv><\u002Fdiv>\n  <div class=\"panel\"><h2>📈 My Progress<\u002Fh2><div class=\"legend\"><span><i style=\"background:#2f9be8\"><\u002Fi>XP<\u002Fspan><span><i style=\"background:#d8262c\"><\u002Fi>Pokémon caught<\u002Fspan><\u002Fdiv><canvas class=\"minichart\" id=\"myChart\"><\u002Fcanvas><\u002Fdiv>\n  <div id=\"trainerCard\"><\u002Fdiv>`;\n  $('#encBtn').onclick=startEncounter;\n  const ql=$('#qList');\n  pending.forEach(q=>{const d=document.createElement('div');ql.appendChild(d);renderQuestion(d,q,async(given,ok,fb)=>{\n    await logResponse(q,given,ok);\n    if(ok){const g=await awardXP(q.xp_value||10);await patchLastResponseXP(g);fb(`✅ Correct! +${g} XP`,true);SFX.correct();\n      setTimeout(async()=>{d.style.transition='opacity .4s';d.style.opacity=0;await checkAchievements();setTimeout(renderPlayBody,450);},1300);}\n    else{SFX.buzz();fb('❌ Not quite, try again!',false);}\n  });});\n  renderGoals();renderPractice();\n  const xpEv=ST.responses.filter(r=>r.xp_earned>0).map(r=>({t:+new Date(r.created_at),v:r.xp_earned}));\n  const cEv=ST.caught.map(c=>({t:+new Date(c.caught_date),v:1}));\n  drawChart($('#myChart'),[{color:'#2f9be8',points:cumulative(xpEv)},{color:'#d8262c',points:cumulative(cEv)}],{normalize:true});\n  $('#trainerCard').innerHTML=trainerCardHTML();bindTrainerCard();\n}\nfunction pendingQuestions(){\n  const done=new Set(ST.responses.filter(r=>r.is_correct).map(r=>r.question_id));\n  return ST.assign.map(a=>S.questions.find(q=>q.id===a.question_id)).filter(q=>q&&!done.has(q.id));\n}\nfunction choicesOf(q){let c=q.choices;if(typeof c==='string'){try{c=JSON.parse(c);}catch(e){c=[];}}return (c||[]).filter(x=>x!==''&&x!=null);}\nfunction checkAnswer(q,given){\n  const g=norm(given),c=norm(q.correct_answer);if(g===c)return true;\n  const ch=choicesOf(q);const idx='abcd'.indexOf(c);\n  if(c.length===1&&idx>=0&&ch[idx]!=null&&norm(ch[idx])===g)return true;\n  const gn=parseFloat(g),cn=parseFloat(c);if(!isNaN(gn)&&!isNaN(cn)&&String(gn)===g&&gn===cn)return true;\n  return false;\n}\nfunction renderQuestion(container,q,onAnswer){\n  q._t0=performance.now();\n  const mc=q.question_type==='multiple_choice'&&choicesOf(q).length;\n  container.className='qcard';\n  container.innerHTML=`<div class=\"qtext\">${esc(q.content)}<\u002Fdiv>\n    ${mc?`<div class=\"choices\">${choicesOf(q).map((c,i)=>`<button class=\"choice\" data-v=\"${esc(c)}\">${'ABCD'[i]||''}. ${esc(c)}<\u002Fbutton>`).join('')}<\u002Fdiv>`\n      :`<input class=\"qinput\" placeholder=\"Type your answer…\" autocomplete=\"off\">`}\n    <button class=\"check green\">Check Answer<\u002Fbutton><div class=\"fb hidden\"><\u002Fdiv>`;\n  let picked=null,locked=false;\n  const fb=(msg,good)=>{const f=container.querySelector('.fb');f.className='fb '+(good?'good':'bad');f.textContent=msg;if(good)locked=true;};\n  container.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(locked)return;SFX.click();picked=b.dataset.v;container.querySelectorAll('.choice').forEach(x=>x.classList.toggle('picked',x===b));});\n  const inp=container.querySelector('.qinput');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')container.querySelector('.check').click();};\n  container.querySelector('.check').onclick=async()=>{\n    if(locked)return;const given=mc?picked:inp.value;if(given==null||String(given).trim()===''){fb('Pick or type an answer first!',false);return;}\n    locked=true;const btn=container.querySelector('.check');btn.disabled=true;\n    try{await onAnswer(given,checkAnswer(q,given),(m,g)=>{fb(m,g);});}catch(e){console.error(e);fb('Error saving: '+e.message,false);}\n    const f=container.querySelector('.fb');if(!f.classList.contains('good')){locked=false;btn.disabled=false;}\n  };\n  return {lock:()=>{locked=true;}};\n}\nasync function logResponse(q,given,ok){\n  const ms=q._t0?Math.round(performance.now()-q._t0):null;\n  const r=await ins('oly_responses',[{student_id:ST.s.id,question_id:q.id||null,answer_given:String(given),is_correct:ok,xp_earned:0,\n    skill_level:q.gen?q.level:null,prompt:q.content,correct_text:q.correct_answer,time_ms:ms}]);\n  ST.responses.push(r[0]);await updateStreak(ok);return r[0];\n}\nasync function patchLastResponseXP(g){\n  const r=ST.responses[ST.responses.length-1];r.xp_earned=g;await upd('oly_responses',`id=eq.${r.id}`,{xp_earned:g});\n}\nfunction renderGoals(){\n  const p=$('#goalsPanel');\n  sel('oly_goals','select=*').then(goals=>{\n    const mine=goalsForStudent(ST.s,goals);const stats=studentStats();\n    p.innerHTML=`<h2>🎯 My Goals<\u002Fh2>${mine.length?mine.map(g=>{const cur=goalValue(g.goal_type,stats),t=Number(g.target_value)||1,pc=Math.min(100,cur/t*100);\n      return `<div class=\"list-item\" style=\"display:block\"><div class=\"row\" style=\"justify-content:space-between\"><b style=\"font-size:1.2rem\">${pc>=100?'✅':'🎯'} ${esc(g.title)}<\u002Fb><span>${g.goal_type==='level'?'Level '+cur:cur} / ${g.goal_type==='level'?'Level '+t:t}<\u002Fspan><\u002Fdiv><div class=\"bar\" style=\"margin-top:6px\"><i style=\"width:${pc}%\"><\u002Fi><\u002Fdiv><\u002Fdiv>`;}).join(''):'<p class=\"muted\">No goals yet. Make one!<\u002Fp>'}\n      <details style=\"margin-top:10px\"><summary style=\"font-weight:600;cursor:pointer;font-size:1.1rem\">➕ Make my own goal<\u002Fsummary>\n      <div class=\"row\" style=\"margin-top:10px\"><select id=\"sgType\">${Object.entries(GOAL_TYPES).map(([k,v])=>`<option value=\"${k}\">${v}<\u002Foption>`).join('')}<\u002Fselect>\n      <input id=\"sgVal\" type=\"number\" min=\"1\" placeholder=\"Number\" style=\"width:130px\"><button class=\"blue\" id=\"sgAdd\">Add Goal<\u002Fbutton><\u002Fdiv><\u002Fdetails>`;\n    $('#sgAdd').onclick=async()=>{const t=$('#sgType').value,val=+$('#sgVal').value;if(!val)return;\n      const titles={xp:`Earn ${val} XP`,catch:`Catch ${val} Pokémon`,event:`Complete ${val} events`,level:`Reach ${(levelInfo(val)||{}).name||'Level '+val}`,streak:`Get ${val} correct in a row`};\n      await ins('oly_goals',[{title:titles[t],goal_type:t,target_value:val,scope:'individual',scope_value:ST.s.id,created_by:'student'}]);\n      await syncGoals(true);renderGoals();};\n  });\n}\n\n/* ---------------- Trainer card ---------------- */\nfunction medalHTML(m){\n  const mt=METALS[m.place-1]||METALS[9];const ev=m.event_id?(S.events.find(e=>e.id===m.event_id)||{}).name:null;\n  const label=ev||(m.sport_type?m.sport_type+' (all events)':'Overall');\n  return `<div class=\"medal\"><div class=\"disc\" style=\"background:${mt[2]}\">${mt[1]}<\u002Fdiv><div><b>${ordinal(m.place)} · ${esc(m.metal_name)}<\u002Fb><small>${esc(label)}<\u002Fsmall><\u002Fdiv><\u002Fdiv>`;\n}\nconst ordinal=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');\nfunction trainerCardHTML(){\n  const st=ST,stats=studentStats(),lv=levelInfo(stats.level),next=LEVELS[stats.level];\n  const pct=next?Math.min(100,(stats.xp-lv.xp)/(next.xp-lv.xp)*100):100;\n  const have=new Set(st.achs.map(a=>a.achievement_id));\n  const caughtThrows=st.throws.length;\n  return `<div class=\"tcard\"><div class=\"tcard-in\">\n   <div class=\"tc-head\"><div><div class=\"bungee muted\" style=\"font-size:.9rem\">TRAINER CARD<\u002Fdiv><div class=\"tc-name\">${esc(st.s.name)}<\u002Fdiv>\n     <div style=\"margin-top:8px;font-size:1.2rem\"><span class=\"lvl-badge\">${lv.n}<\u002Fspan><b>${esc(lv.name)}<\u002Fb><\u002Fdiv><\u002Fdiv>\n     <div style=\"text-align:right\">${st.s.class_name?`<span class=\"tag el\" style=\"font-size:1.2rem;padding:6px 16px\">${esc(st.s.class_name)}<\u002Fspan>`:''}<div class=\"pball\" style=\"width:80px;height:80px;margin:10px 0 0 auto\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n   <div class=\"bar\" style=\"margin-top:12px\"><i style=\"width:${pct}%\"><\u002Fi><\u002Fdiv><small>${stats.xp} XP${next?` · ${next.xp-stats.xp} to ${next.name}`:''}<\u002Fsmall>\n   <div class=\"tc-grid\">\n     <div>Total XP<b>${stats.xp}<\u002Fb><\u002Fdiv><div>Pokémon caught<b>${stats.caught}<\u002Fb><\u002Fdiv>\n     <div>Catch rate<b>${caughtThrows?Math.round(stats.caught/caughtThrows*100):0}%<\u002Fb><\u002Fdiv>\n     <div>Correct answers<b>${stats.correct}<\u002Fb><\u002Fdiv><div>Questions tried<b>${stats.attempted}<\u002Fb><\u002Fdiv>\n     <div>Correct %<b>${stats.attempted?Math.round(stats.correct/stats.attempted*100):0}%<\u002Fb><\u002Fdiv>\n     <div>Events completed<b>${stats.completed}<\u002Fb><\u002Fdiv><div>Current streak<b>🔥 ${stats.streak}<\u002Fb><\u002Fdiv><div>Math level<b>${mathLevel(st)}<\u002Fb><small>${esc(MATH_LEVELS[mathLevel(st)].name)}<\u002Fsmall><\u002Fdiv>\n   <\u002Fdiv>\n   <h3 style=\"color:var(--red-deep)\">Achievements<\u002Fh3>\n   <div class=\"ach-grid\">${S.achievements.map(a=>have.has(a.id)?`<div class=\"ach\" data-d=\"${esc(a.name+': '+a.description)}\"><div class=\"ic\">${esc(a.icon_url||'🏆')}<\u002Fdiv><div class=\"an\">${esc(a.name)}<\u002Fdiv><\u002Fdiv>`:`<div class=\"ach locked\"><div class=\"ic\">${esc(a.icon_url||'🏆')}<\u002Fdiv><div class=\"an\">???<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>\n   <h3 style=\"color:var(--red-deep)\">Medals<\u002Fh3>\n   <div class=\"medals\">${st.medals.length?[...st.medals].sort((a,b)=>a.place-b.place).map(medalHTML).join(''):'<span class=\"muted\">No medals yet — try an event!<\u002Fspan>'}<\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>`;\n}\nfunction bindTrainerCard(){document.querySelectorAll('#trainerCard .ach[data-d]').forEach(a=>a.onclick=()=>toast(a.dataset.d,'🏆'));}\n\n/* ============================================================\n   ENCOUNTER\n   ============================================================ */\n\n/* ============================================================\n   GENERATED MATH (adaptive ladder)\n   ============================================================ */\nconst ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst MATH_LEVELS=[null,\n {name:'Count to 10',teks:'K.2B',t:8,g:()=>{const n=ri(1,10),e=rand(['🍎','⭐','🐸','⚽','🍪','🐟']);return {q:`How many? ${e.repeat(n)}`,a:n};}},\n {name:'Bigger number',teks:'K.2H',t:8,g:()=>{let a=ri(0,20),b;do b=ri(0,20);while(b===a);return {q:`Which number is bigger?`,a:Math.max(a,b),ch:[a,b]};}},\n {name:'Add within 5',teks:'K.3A',t:8,g:()=>{const a=ri(0,5),b=ri(0,5-a);return {q:`${a} + ${b} = ?`,a:a+b};}},\n {name:'Subtract within 5',teks:'K.3A',t:8,g:()=>{const a=ri(1,5),b=ri(0,a);return {q:`${a} − ${b} = ?`,a:a-b};}},\n {name:'Add within 10',teks:'K.3B',t:8,g:()=>{const a=ri(0,10),b=ri(0,10-a);return {q:`${a} + ${b} = ?`,a:a+b};}},\n {name:'Subtract within 10',teks:'1.3D',t:8,g:()=>{const a=ri(2,10),b=ri(0,a);return {q:`${a} − ${b} = ?`,a:a-b};}},\n {name:'Make 10',teks:'1.3C',t:8,g:()=>{const a=ri(0,10);return {q:`${a} + ? = 10`,a:10-a};}},\n {name:'Add within 20',teks:'1.3D',t:10,g:()=>{const a=ri(2,10),b=ri(Math.max(1,11-a),10);return {q:`${a} + ${b} = ?`,a:a+b};}},\n {name:'Subtract within 20',teks:'1.3D',t:10,g:()=>{const a=ri(11,20),b=ri(a-10,10);return {q:`${a} − ${b} = ?`,a:a-b};}},\n {name:'Tens and ones',teks:'1.2B',t:10,g:()=>{const t=ri(1,9),o=ri(0,9);return {q:`${t} tens and ${o} ones = ?`,a:t*10+o};}},\n {name:'10 more / 10 less',teks:'1.5C',t:10,g:()=>{const n=ri(10,89),m=Math.random()<.5;return {q:`10 ${m?'more':'less'} than ${n} = ?`,a:m?n+10:n-10};}},\n {name:'2-digit add (no regroup)',teks:'2.4C',t:15,g:()=>{const a1=ri(1,8),b1=ri(1,9-a1),a0=ri(0,9),b0=ri(0,9-a0);const a=a1*10+a0,b=b1*10+b0;return {q:`${a} + ${b} = ?`,a:a+b};}},\n {name:'2-digit subtract (no regroup)',teks:'2.4C',t:15,g:()=>{const a1=ri(2,9),b1=ri(1,a1-1),a0=ri(0,9),b0=ri(0,a0);const a=a1*10+a0,b=b1*10+b0;return {q:`${a} − ${b} = ?`,a:a-b};}},\n {name:'2-digit add/subtract (regroup)',teks:'2.4C',t:20,g:()=>{if(Math.random()<.5){const a0=ri(2,9),b0=ri(10-a0,9),a=ri(1,6)*10+a0,b=ri(1,8-Math.floor(a/10))*10+b0;return {q:`${a} + ${b} = ?`,a:a+b};}const a0=ri(0,8),b0=ri(a0+1,9),a=ri(3,9)*10+a0,b=ri(1,Math.floor(a/10)-1)*10+b0;return {q:`${a} − ${b} = ?`,a:a-b};}},\n {name:'Skip counting',teks:'2.7B',t:10,g:()=>{const st=rand([2,5,10]),k=ri(1,15),seq=[0,1,2].map(i=>(k+i)*st);return {q:`${seq.join(', ')}, ?`,a:(k+3)*st};}},\n {name:'Multiply by 2, 5, 10',teks:'3.4E',t:8,g:()=>{const a=rand([2,5,10]),b=ri(1,10);return Math.random()<.5?{q:`${a} × ${b} = ?`,a:a*b}:{q:`${b} × ${a} = ?`,a:a*b};}},\n {name:'Multiplication facts',teks:'3.4F',t:8,g:()=>{const a=ri(2,10),b=ri(2,10);return {q:`${a} × ${b} = ?`,a:a*b};}},\n {name:'Division facts',teks:'3.4F',t:10,g:()=>{const a=ri(2,10),b=ri(1,10);return {q:`${a*b} ÷ ${a} = ?`,a:b};}},\n {name:'3-digit add/subtract',teks:'3.4A',t:25,g:()=>{const a=ri(100,899),b=ri(100,999-a);if(Math.random()<.5)return {q:`${a} + ${b} = ?`,a:a+b};const c=ri(200,999),d=ri(100,c-50);return {q:`${c} − ${d} = ?`,a:c-d};}},\n];\nconst MAX_LEVEL=MATH_LEVELS.length-1;\nconst START_LEVEL={K:2,'1':6,'2':10,'3':14};\nfunction mathLevel(st=ST){return st.xp.math_level||START_LEVEL[studentGrade(st.s)]||6;}\nfunction nearChoices(a){\n  const set=new Set([a]);const cand=[a+1,a-1,a+2,a-2,a+10,a-10,+String(a).split('').reverse().join('')||a+3,a+5].filter(x=>x>=0&&x!==a);\n  for(const c of shuffle(cand)){if(set.size>=4)break;set.add(c);}\n  while(set.size<4)set.add(a+set.size+3);\n  return shuffle([...set]);\n}\nfunction genMath(level){\n  const L=MATH_LEVELS[level],r=L.g(),k=studentGrade(ST.s)==='K';\n  const mc=r.ch||k||Math.random()<.5;\n  return {id:null,gen:true,level,subject:'Math',content:r.q,correct_answer:String(r.a),question_type:mc?'multiple_choice':'short_answer',\n    choices:mc?(r.ch||nearChoices(r.a)).map(String):[],difficulty_level:level,skill_tag:L.name,teks_standard:L.teks,xp_value:10};\n}\nfunction nextMath(){\n  const L=mathLevel();\n  const lvl=L>1&&Math.random()<.2?ri(Math.max(1,L-3),L-1):L;\n  return genMath(lvl);\n}\nasync function adaptMath(q){\n  if(!q.gen||q.level!==mathLevel())return;\n  const recent=ST.responses.filter(r=>r.skill_level===q.level).slice(-10);\n  const right=recent.filter(r=>r.is_correct).length;\n  const times=recent.filter(r=>r.is_correct&&r.time_ms).map(r=>r.time_ms).sort((a,b)=>a-b);\n  const med=times.length?times[Math.floor(times.length/2)]:Infinity;\n  const target=MATH_LEVELS[q.level].t*1000*(studentGrade(ST.s)==='K'?2:1);\n  let nl=q.level;\n  if(recent.length>=10&&right>=8&&med<=target&&q.level<MAX_LEVEL)nl=q.level+1;\n  else if(recent.length>=6&&right/recent.length<=.4&&q.level>1)nl=q.level-1;\n  if(nl!==q.level){await saveXP({math_level:nl});\n    if(nl>q.level){SFX.levelup();toast(`Math level up! Now: ${MATH_LEVELS[nl].name}`,'🚀');}\n    else toast(`Let's practice: ${MATH_LEVELS[nl].name}`,'💪');}\n}\nfunction renderPractice(){\n  const box=$('#mathBox');if(!box)return;\n  const q=nextMath();const d=document.createElement('div');box.innerHTML='';box.appendChild(d);\n  renderQuestion(d,q,async(given,ok,fb)=>{\n    await logResponse(q,given,ok);\n    if(ok){const g=await awardXP(q.xp_value);await patchLastResponseXP(g);SFX.correct();fb(`✅ Correct! +${g} XP`,true);\n      await adaptMath(q);setTimeout(async()=>{await checkAchievements();renderPlayBody();},1100);}\n    else{SFX.buzz();fb('❌ Not quite, try again!',false);await adaptMath(q);}\n  });\n}\n\nlet ENC=null;\nfunction pickQuestion(exclude){\n  const pend=pendingQuestions().filter(q=>!exclude.has(q.id));\n  if(pend.length)return rand(pend);\n  return nextMath();\n}\nfunction startEncounter(){\n  const set=settingsFor(ST.s.class_name),w=wallet();\n  const o=openOverlay(`<div class=\"modal\"><h2>Choose your ball!<\u002Fh2>\n    <div class=\"ball-choice\">\n      <button data-b=\"pokeball\" ${w<set.pokeball_cost?'disabled':''}><div class=\"pball\"><\u002Fdiv>Poké Ball<span class=\"bungee\">${set.pokeball_cost} XP<\u002Fspan><small>One try<\u002Fsmall><\u002Fbutton>\n      <button data-b=\"greatball\" ${w<set.greatball_cost?'disabled':''}><div class=\"pball great\"><\u002Fdiv>Great Ball<span class=\"bungee\">${set.greatball_cost} XP<\u002Fspan><small>One extra chance!<\u002Fsmall><\u002Fbutton>\n    <\u002Fdiv><p style=\"text-align:center;font-size:1.2rem\">You have <b>${w} XP<\u002Fb> to spend<\u002Fp>\n    <div style=\"text-align:center\"><button data-b=\"cancel\">Not now<\u002Fbutton><\u002Fdiv><\u002Fdiv>`);\n  o.onclick=async e=>{\n    const b=e.target.closest('button')?.dataset.b;if(!b)return;if(b==='cancel'){o.close();return;}\n
